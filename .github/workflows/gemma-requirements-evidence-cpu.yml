name: Gemma Requirements Evidence Prototype CPU

on:
  push:
    branches: [research/dual-agent-recovery-v0-20261108]
    paths:
      - scripts/requirements_evidence_20261121.py
      - tests/test_requirements_evidence_20261121.py
      - .github/workflows/gemma-requirements-evidence-cpu.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-cpu-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and interface check
        run: python -m py_compile scripts/requirements_evidence_20261121.py
      - name: Bounded synthetic evidence tests
        run: python -m unittest discover -s tests -p 'test_requirements_evidence_20261121.py' -v
      - name: Scope
        run: echo 'CPU only; NO 31B scorer or Kaggle submission'
