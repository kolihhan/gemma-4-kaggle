name: Official Toolcap60 Safety 5-minute Timeout Recovery Once
on:
  push:
    branches: [research/dual-agent-recovery-v0-20261108]
    paths: [".github/workflows/toolcap60-safetime5-official-once.yml"]
permissions:
  contents: read
concurrency:
  group: gemma4-toolcap60-safetime5-20261110
  cancel-in-progress: false
jobs:
  code_submission:
    if: "${{ github.event.head_commit.message == 'GO_GEMMA_OLD_SAFETIME5_20261110' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CPU tests, source contract and timeout-risk facts
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_toolcap60_timeout_recovery.py scripts/submit_toolcap60_timeout_recovery_once.py
          python -m unittest -v             tests.test_build_toolcap60_timeout_recovery             tests.test_build_v2_toolcap_submission             tests.test_prepare_public_budgetfit_v2
          python - <<'PY'
          assumed_issues=120
          task_minutes=5
          total_minutes=12*60
          ceiling=assumed_issues*task_minutes
          assert ceiling==600 and ceiling<total_minutes
          print("MAX_AGENT_TASK_MINUTES_FOR_120_ISSUES",ceiling)
          print("HEADROOM_BEFORE_SETUP_AND_OVERHEAD_MINUTES",total_minutes-ceiling)
          print("HIDDEN_ISSUE_COUNT_UNVERIFIED=TRUE")
          print("NO_GUARANTEE_AGAINST_OTHER_PLATFORM_TIMEOUTS=TRUE")
          print("NOVEL_SOLVER_CORRECTNESS_GAIN_PROVEN=FALSE")
          PY
      - name: Authenticate and prevent duplicate official submissions
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0" "nbformat==5.10.4"
          python -m scripts.submit_toolcap60_timeout_recovery_once quota
      - name: Install official current CPU compiler and scorer schema
        run: |
          set -euo pipefail
          mkdir -p /tmp/gemma4-official-safetime5-wheels
          for wheel in adk_submission-0.2.13-py3-none-any.whl google_adk-1.36.1-py3-none-any.whl adk_eval_core-0.1.0-py3-none-any.whl swegemma-0.2.11-py3-none-any.whl; do
            kaggle datasets download -d metric/gemma-4-developer-agent-wheelhouse -f "$wheel"               -p /tmp/gemma4-official-safetime5-wheels --unzip >/dev/null
          done
          python -m pip install -q --disable-pip-version-check /tmp/gemma4-official-safetime5-wheels/*.whl
          python - <<'PY'
          import importlib.metadata as m
          for pkg,expected in (
              ("adk-submission","0.2.13"),("google-adk","1.36.1"),
              ("adk-eval-core","0.1.0"),("swegemma","0.2.11")):
              actual=m.version(pkg)
              assert actual==expected,(pkg,actual)
              print("OFFICIAL_PACKAGE_VERIFIED",pkg,actual)
          PY
      - name: Compile original V2-derived 5-minute archive without model inference
        run: |
          set -euo pipefail
          python -m scripts.submit_toolcap60_timeout_recovery_once preflight
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,yaml
          p=Path("/tmp/gemma4-toolcap60-safetime5-submit/submission.zip")
          with zipfile.ZipFile(p) as z:
              assert set(z.namelist())=={"agent.yaml","prompts/system.md","configs/sampling.yaml","eval_config.yaml"}
              settings=yaml.safe_load(z.read("eval_config.yaml"))["evaluation"]
              assert settings["max_time_minutes"]==5
              assert settings["max_tool_calls"]==60
              assert settings["max_turns"]==80
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest==Path("/tmp/gemma4-toolcap60-safetime5-submit/candidate.sha256").read_text()
          print("SAFETIME5_FINAL_LOCAL_ARCHIVE_SHA256",digest)
          print("OFFICIAL_CPU_COMPILE_GATE=PASS")
          PY
      - name: Create private CPU builder, verify byte-identical remote ZIP, official submit once
        run: |
          set -euo pipefail
          python -m scripts.submit_toolcap60_timeout_recovery_once submit
          echo "SUBMISSION_OPERATOR_TERMINAL=TRUE"

  existing_tests_official_once:
    if: "${{ github.event.head_commit.message == 'GO_GEMMA_31B_EXISTING_TESTS_SCORE_20261117' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Single hypothesis and authenticated Kaggle quota
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m py_compile scripts/build_gemma31_existing_tests.py scripts/submit_existing_test_retrieval_official_once_20261117.py
          echo 'GEMMA_HYPOTHESIS=existing-tests-before-edit; EXPECTED_DELTA=+0.02_SPECULATIVE; KILL_PUBLIC_LE_0.18_OR_UNSCORED'
          echo 'GEMMA_NO_DEV_GPU_NO_TRAINING=TRUE'
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0 nbformat==5.10.4
          python -m scripts.submit_existing_test_retrieval_official_once_20261117 quota
      - name: Install official native CPU compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gemma-existing-test-official-wheels
          for wheel in adk_submission-0.2.13-py3-none-any.whl google_adk-1.36.1-py3-none-any.whl adk_eval_core-0.1.0-py3-none-any.whl swegemma-0.2.11-py3-none-any.whl; do
            kaggle datasets download -d metric/gemma-4-developer-agent-wheelhouse -f "$wheel" -p /tmp/gemma-existing-test-official-wheels --unzip >/dev/null
          done
          python -m pip install -q --disable-pip-version-check /tmp/gemma-existing-test-official-wheels/*.whl
      - name: CPU sanity official compile and hashed one-mechanism 31B archive
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.submit_existing_test_retrieval_official_once_20261117 prepare
          python - <<'PY'
          import zipfile,hashlib
          from pathlib import Path
          root=Path('/tmp/gemma4-existing-tests-official-once')
          with zipfile.ZipFile(root/'candidate.zip') as z:
            names=set(z.namelist())
            assert {'agent.yaml','eval_config.yaml','prompts/system.md','configs/sampling.yaml'}<=names
            assert {'skills/existing-test-retrieval/SKILL.md',
                    'skills/existing-test-retrieval/scripts/retrieve.py'}<=names
            assert b'gemma-4-31b-it-qat-w4a16-ct' in z.read('agent.yaml')
            import yaml
            cfg=yaml.safe_load(z.read('eval_config.yaml'))['evaluation']
            assert cfg['max_time_minutes']==5
            assert cfg['max_tool_calls']==60
            assert cfg['max_turns']==80
          assert hashlib.sha256((root/'candidate.zip').read_bytes()).hexdigest()==(root/'candidate.sha256').read_text()
          print('GEMMA_RETRIEVAL_SINGLE_CPU_ARCHIVE=PASS',flush=True)
          PY
      - name: Verify new CPU builder remotely and official Kaggle submit once
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.submit_existing_test_retrieval_official_once_20261117 submit
          echo "GEMMA_EXISTING_TESTS_OFFICIAL_WORKFLOW_TERMINAL=TRUE"
