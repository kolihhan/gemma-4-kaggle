name: Capacity v0 freeze paired cohort static contract

on:
  push:
    branches: [exp/capacity-boundary-v0]
    paths:
      - "scripts/freeze_capacity_paired_v0.py"
      - "tests/test_freeze_capacity_paired_v0.py"
      - ".github/workflows/capacity-freeze-paired-static-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-metadata-only-allocator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test deterministic 4+12 assignment and fail-closed source gates
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_freeze_capacity_paired_v0 tests.test_render_capacity_replacement_noop_v0 tests.test_build_capacity_replacements_v0
          python -m py_compile scripts/freeze_capacity_paired_v0.py
      - name: Declare no benchmark inference
        run: |
          echo "CAPACITY_FROZEN_ALLOCATION_STATIC_ONLY=TRUE"
          echo "KAGGLE_GPU_USED=NO"
          echo "MODEL_EVALUATION_EXECUTED=NO"
