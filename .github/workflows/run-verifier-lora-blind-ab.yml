name: Frozen blind base-vs-LoRA v0

on:
  push:
    branches: [exp/public-train-once]
    paths:
      - ".github/workflows/run-verifier-lora-blind-ab.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: verifier-lora-v0-blind-ab
  cancel-in-progress: false

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  TRAIN_RUN_ID: "41429301498"
  TRAIN_ARTIFACT_NAME: "gemma4-verifier-lora-v0-41429301498"
  ADAPTER_SHA256: "ea8333fa87eb2e3fc28a29bd6911f47457b1f8a381bba7e5e842ac09cb0b4123"
  ADAPTER_DATASET: "kolihhan/gemma4-verifier-lora-v0-fullseq-41429301498"
  MODEL_SOURCE: "google/gemma-4/Other/gemma-4-e4b-it-qat-w4a16-ct/2"

jobs:
  blind-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Kaggle CLI
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0"
          kaggle --version

      - name: Download frozen full-sequence adapter artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TRAIN_ARTIFACT_NAME }}
          path: /tmp/train-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.TRAIN_RUN_ID }}

      - name: Verify and publish adapter as private Kaggle dataset
        shell: bash
        run: |
          set -euo pipefail
          ADAPTER_SRC="/tmp/train-artifact/verifier-lora-v0/adapter"
          test -s "$ADAPTER_SRC/adapter_config.json"
          test -s "$ADAPTER_SRC/adapter_model.safetensors"
          actual_sha="$(sha256sum "$ADAPTER_SRC/adapter_model.safetensors" | awk '{print $1}')"
          echo "adapter_sha256=$actual_sha"
          test "$actual_sha" = "$ADAPTER_SHA256"

          DS_DIR="/tmp/adapter-dataset"
          rm -rf "$DS_DIR"
          mkdir -p "$DS_DIR/adapter"
          cp "$ADAPTER_SRC/adapter_config.json" "$DS_DIR/adapter/"
          cp "$ADAPTER_SRC/adapter_model.safetensors" "$DS_DIR/adapter/"
          cp /tmp/train-artifact/verifier-lora-v0/training_report.json "$DS_DIR/" || true

          cat > "$DS_DIR/dataset-metadata.json" <<EOF
          {
            "title": "Gemma 4 verifier LoRA v0 full-sequence 41429301498",
            "id": "${ADAPTER_DATASET}",
            "licenses": [{"name": "other"}],
            "isPrivate": true
          }
          EOF

          if kaggle datasets files "$ADAPTER_DATASET" >/tmp/dataset-files.txt 2>/tmp/dataset-files.err; then
            echo "private adapter dataset already exists; reusing"
            cat /tmp/dataset-files.txt
          else
            kaggle datasets create -p "$DS_DIR" -r zip
          fi

      - name: Render frozen blind BASE kernel
        shell: bash
        env:
          KERNEL_DIR: /tmp/blind-base-kernel
          OUTPUT_DIR: /tmp/blind-base-output
          KERNEL_REF: kolihhan/gemma4-verifier-blind-base-${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf "$KERNEL_DIR" "$OUTPUT_DIR"
          mkdir -p "$KERNEL_DIR" "$OUTPUT_DIR"
          python - <<'PY'
          import base64, json, os
          from pathlib import Path

          repo = Path.cwd()
          submission = repo / "submission"
          template_path = repo / "kaggle" / "verifier_baseline_runtime.py"
          reservation_path = repo / "docs" / "evaluation" / "verifier-lora-blind-reservation-v0.json"
          kernel_dir = Path(os.environ["KERNEL_DIR"])

          payload = {}
          for path in sorted(submission.rglob("*")):
              if path.is_file():
                  rel = path.relative_to(submission).as_posix()
                  if rel.startswith("adapters/"):
                      raise SystemExit(f"base submission unexpectedly contains adapter: {rel}")
                  payload[rel] = path.read_text(encoding="utf-8")
          if "agent.yaml" not in payload or "sub_agents/verifier.yaml" not in payload:
              raise SystemExit("canonical two-stage submission is incomplete")
          if "adapter:" in payload["sub_agents/verifier.yaml"]:
              raise SystemExit("base verifier must not declare an adapter")

          reservation = json.loads(reservation_path.read_text(encoding="utf-8"))
          tasks = reservation.get("tasks") or []
          if reservation.get("version") != "verifier-lora-v0-blind-reservation" or len(tasks) != 10:
              raise SystemExit("unexpected frozen blind reservation")
          manifest = {"version": "verifier-lora-v0", "holdout": tasks}

          encoded = base64.b64encode(
              json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          ).decode("ascii")
          text = template_path.read_text(encoding="utf-8")
          text = text.replace("__SUBMISSION_PAYLOAD_B64__", encoded, 1)
          marker = 'HOLDOUT_MANIFEST_JSON = "__VERIFIER_LORA_HOLDOUT_MANIFEST_JSON__"'
          text = text.replace(marker, f"HOLDOUT_MANIFEST_JSON = {json.dumps(manifest, sort_keys=True)!r}", 1)
          compile(text, "blind_base_runtime.py", "exec")
          (kernel_dir / "blind_base_runtime.py").write_text(text, encoding="utf-8")

          meta = {
              "id": os.environ["KERNEL_REF"],
              "title": f"Gemma4 frozen blind BASE {os.environ['GITHUB_RUN_ID']}",
              "code_file": "blind_base_runtime.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_tpu": False,
              "enable_internet": False,
              "machine_shape": "NvidiaL4",
              "docker_image": "gcr.io/kaggle-private-byod/python@sha256:37c64f7dd9c54116ecd1bcc88817c5469b88387388fade02bfa8bf3fc647d461",
              "dataset_sources": ["metric/gemma-4-developer-agent-wheelhouse"],
              "competition_sources": ["gemma-4-developer-agent"],
              "kernel_sources": [],
              "model_sources": [os.environ["MODEL_SOURCE"]],
          }
          (kernel_dir / "kernel-metadata.json").write_text(json.dumps(meta, indent=2) + "\n", encoding="utf-8")
          print("blind_ids=", [x["instance_id"] for x in tasks])
          print("base_submission_files=", sorted(payload))
          PY
          kaggle kernels push -p "$KERNEL_DIR" --accelerator NvidiaL4 -t 7200

      - name: Poll frozen blind BASE
        id: base_poll
        shell: bash
        env:
          KERNEL_REF: kolihhan/gemma4-verifier-blind-base-${{ github.run_id }}
        run: |
          set -euo pipefail
          terminal=""
          for attempt in $(seq 1 300); do
            out="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            printf '[BASE %03d] %s\n' "$attempt" "$out"
            lower="$(printf '%s' "$out" | tr '[:upper:]' '[:lower:]')"
            if grep -Eq 'complete|completed' <<<"$lower"; then terminal=complete; break; fi
            if grep -Eq 'error|failed|failure|cancelled|canceled' <<<"$lower"; then terminal=error; break; fi
            sleep 20
          done
          test -n "$terminal" || terminal=timeout
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"

      - name: Collect and assert frozen blind BASE
        shell: bash
        env:
          KERNEL_REF: kolihhan/gemma4-verifier-blind-base-${{ github.run_id }}
          OUTPUT_DIR: /tmp/blind-base-output
        run: |
          set -euo pipefail
          test "${{ steps.base_poll.outputs.terminal }}" = "complete"
          mkdir -p "$OUTPUT_DIR"
          kaggle kernels logs "$KERNEL_REF" > "$OUTPUT_DIR/kernel.log" 2>&1 || true
          kaggle kernels output "$KERNEL_REF" -p "$OUTPUT_DIR" -o > "$OUTPUT_DIR/output-download.log" 2>&1
          test -s "$OUTPUT_DIR/verifier_baseline_results.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["OUTPUT_DIR"]) / "verifier_baseline_results.json"
          r = json.loads(p.read_text())
          assert r.get("status") == "completed", r
          assert r.get("requested") == 10, r
          assert len(r.get("results", [])) == 10, r
          print("BASE_BLIND_SUMMARY", json.dumps({k:v for k,v in r.items() if k!="results"}, sort_keys=True))
          PY

      - name: Render frozen blind LoRA kernel
        shell: bash
        env:
          KERNEL_DIR: /tmp/blind-lora-kernel
          OUTPUT_DIR: /tmp/blind-lora-output
          KERNEL_REF: kolihhan/gemma4-verifier-blind-lora-${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf "$KERNEL_DIR" "$OUTPUT_DIR"
          mkdir -p "$KERNEL_DIR" "$OUTPUT_DIR"
          python - <<'PY'
          import base64, json, os
          from pathlib import Path

          repo = Path.cwd()
          submission = repo / "submission"
          template_path = repo / "kaggle" / "verifier_baseline_runtime.py"
          reservation_path = repo / "docs" / "evaluation" / "verifier-lora-blind-reservation-v0.json"
          kernel_dir = Path(os.environ["KERNEL_DIR"])

          payload = {}
          for path in sorted(submission.rglob("*")):
              if path.is_file():
                  rel = path.relative_to(submission).as_posix()
                  if rel.startswith("adapters/"):
                      continue
                  payload[rel] = path.read_text(encoding="utf-8")
          verifier = payload.get("sub_agents/verifier.yaml", "")
          needle = "model: gemma-4-e4b-it-qat-w4a16-ct\n"
          if verifier.count(needle) != 1 or "adapter:" in verifier:
              raise SystemExit("unexpected verifier yaml before adapter injection")
          payload["sub_agents/verifier.yaml"] = verifier.replace(
              needle, needle + "adapter: verifier_lora\n", 1
          )

          reservation = json.loads(reservation_path.read_text(encoding="utf-8"))
          tasks = reservation.get("tasks") or []
          if reservation.get("version") != "verifier-lora-v0-blind-reservation" or len(tasks) != 10:
              raise SystemExit("unexpected frozen blind reservation")
          manifest = {"version": "verifier-lora-v0", "holdout": tasks}

          encoded = base64.b64encode(
              json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          ).decode("ascii")
          text = template_path.read_text(encoding="utf-8")
          text = text.replace("__SUBMISSION_PAYLOAD_B64__", encoded, 1)
          marker = 'HOLDOUT_MANIFEST_JSON = "__VERIFIER_LORA_HOLDOUT_MANIFEST_JSON__"'
          text = text.replace(marker, f"HOLDOUT_MANIFEST_JSON = {json.dumps(manifest, sort_keys=True)!r}", 1)

          insert_before = "\ndef load_holdout_ids() -> list[str]:\n"
          adapter_fn = '''
          def materialize_frozen_adapter() -> None:
              source = Path("/kaggle/input/datasets/kolihhan/gemma4-verifier-lora-v0-fullseq-41429301498/adapter")
              target = AGENT_DIR / "adapters" / "verifier_lora"
              target.mkdir(parents=True, exist_ok=True)
              for name in ("adapter_config.json", "adapter_model.safetensors"):
                  src = source / name
                  if not src.is_file():
                      raise FileNotFoundError(f"missing frozen adapter file: {src}")
                  shutil.copyfile(src, target / name)
          '''
          adapter_fn = "\n".join(line[10:] if line.startswith("          ") else line for line in adapter_fn.splitlines())
          if text.count(insert_before) != 1:
              raise SystemExit("could not locate adapter-function insertion point")
          text = text.replace(insert_before, "\n" + adapter_fn + insert_before, 1)

          call = "    materialize_submission()\n    holdout_ids = load_holdout_ids()\n"
          replacement = "    materialize_submission()\n    materialize_frozen_adapter()\n    holdout_ids = load_holdout_ids()\n"
          if text.count(call) != 1:
              raise SystemExit("could not locate adapter materialization call site")
          text = text.replace(call, replacement, 1)

          old_guard = '    adapter_map = getattr(adapters, "adapters", None) or {}\n    if adapter_map:\n        raise RuntimeError(f"baseline v0 must not contain adapters: {sorted(adapter_map)}")\n'
          new_guard = '    adapter_map = getattr(adapters, "adapters", None) or {}\n    if set(adapter_map) != {"verifier_lora"}:\n        raise RuntimeError(f"LoRA v0 expected only verifier_lora adapter, got: {sorted(adapter_map)}")\n'
          if text.count(old_guard) != 1:
              raise SystemExit("could not locate baseline adapter guard")
          text = text.replace(old_guard, new_guard, 1)
          if text.count("enable_lora=False") != 1:
              raise SystemExit("unexpected enable_lora occurrence count")
          text = text.replace("enable_lora=False", "enable_lora=True", 1)

          compile(text, "blind_lora_runtime.py", "exec")
          (kernel_dir / "blind_lora_runtime.py").write_text(text, encoding="utf-8")

          meta = {
              "id": os.environ["KERNEL_REF"],
              "title": f"Gemma4 frozen blind LoRA {os.environ['GITHUB_RUN_ID']}",
              "code_file": "blind_lora_runtime.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_tpu": False,
              "enable_internet": False,
              "machine_shape": "NvidiaL4",
              "docker_image": "gcr.io/kaggle-private-byod/python@sha256:37c64f7dd9c54116ecd1bcc88817c5469b88387388fade02bfa8bf3fc647d461",
              "dataset_sources": [
                  "metric/gemma-4-developer-agent-wheelhouse",
                  os.environ["ADAPTER_DATASET"],
              ],
              "competition_sources": ["gemma-4-developer-agent"],
              "kernel_sources": [],
              "model_sources": [os.environ["MODEL_SOURCE"]],
          }
          (kernel_dir / "kernel-metadata.json").write_text(json.dumps(meta, indent=2) + "\n", encoding="utf-8")
          print("blind_ids=", [x["instance_id"] for x in tasks])
          print("lora_verifier_yaml=", payload["sub_agents/verifier.yaml"])
          PY
          kaggle kernels push -p "$KERNEL_DIR" --accelerator NvidiaL4 -t 7200

      - name: Poll frozen blind LoRA
        id: lora_poll
        shell: bash
        env:
          KERNEL_REF: kolihhan/gemma4-verifier-blind-lora-${{ github.run_id }}
        run: |
          set -euo pipefail
          terminal=""
          for attempt in $(seq 1 300); do
            out="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            printf '[LORA %03d] %s\n' "$attempt" "$out"
            lower="$(printf '%s' "$out" | tr '[:upper:]' '[:lower:]')"
            if grep -Eq 'complete|completed' <<<"$lower"; then terminal=complete; break; fi
            if grep -Eq 'error|failed|failure|cancelled|canceled' <<<"$lower"; then terminal=error; break; fi
            sleep 20
          done
          test -n "$terminal" || terminal=timeout
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"

      - name: Collect, assert, and compare frozen blind LoRA
        shell: bash
        env:
          KERNEL_REF: kolihhan/gemma4-verifier-blind-lora-${{ github.run_id }}
          OUTPUT_DIR: /tmp/blind-lora-output
        run: |
          set -euo pipefail
          test "${{ steps.lora_poll.outputs.terminal }}" = "complete"
          mkdir -p "$OUTPUT_DIR"
          kaggle kernels logs "$KERNEL_REF" > "$OUTPUT_DIR/kernel.log" 2>&1 || true
          kaggle kernels output "$KERNEL_REF" -p "$OUTPUT_DIR" -o > "$OUTPUT_DIR/output-download.log" 2>&1
          test -s "$OUTPUT_DIR/verifier_baseline_results.json"
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path("/tmp/blind-base-output/verifier_baseline_results.json").read_text())
          lora = json.loads(Path("/tmp/blind-lora-output/verifier_baseline_results.json").read_text())
          assert base.get("requested") == lora.get("requested") == 10
          base_ids = [x["instance_id"] for x in base["results"]]
          lora_ids = [x["instance_id"] for x in lora["results"]]
          assert base_ids == lora_ids
          base_resolved = set(base.get("resolved_instance_ids") or [])
          lora_resolved = set(lora.get("resolved_instance_ids") or [])
          comparison = {
              "version": "verifier-lora-v0-frozen-blind-ab",
              "base_resolved": len(base_resolved),
              "lora_resolved": len(lora_resolved),
              "delta_resolved": len(lora_resolved) - len(base_resolved),
              "base_only": sorted(base_resolved - lora_resolved),
              "lora_only": sorted(lora_resolved - base_resolved),
              "both": sorted(base_resolved & lora_resolved),
              "neither": sorted(set(base_ids) - base_resolved - lora_resolved),
              "base_completed": base.get("completed"),
              "lora_completed": lora.get("completed"),
          }
          Path("/tmp/blind-ab-comparison.json").write_text(json.dumps(comparison, indent=2, sort_keys=True) + "\n")
          print("FROZEN_BLIND_AB", json.dumps(comparison, sort_keys=True))
          PY

      - name: Upload frozen blind A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-verifier-lora-v0-frozen-blind-ab-${{ github.run_id }}
          path: |
            /tmp/blind-base-output
            /tmp/blind-lora-output
            /tmp/blind-ab-comparison.json
          if-no-files-found: warn
          retention-days: 30
