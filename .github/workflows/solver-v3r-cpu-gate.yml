name: Solver V3-R evidence mechanism and official ADK CPU gate
on:
  push:
    branches: [research/dual-agent-recovery-v0-20261108]
    paths: [".github/workflows/solver-v3r-cpu-gate.yml"]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Behavioral witness tests and candidate reproducibility
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check "pytest==8.4.2"
          python -m unittest -v tests.test_solver_v3r_witness tests.test_build_solver_v3r_candidate
      - name: Official CPU compiler and generated ZIP verification, no GPU
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0"
          mkdir -p /tmp/solver-v3r-wheels /tmp/solver-v3r-source
          for wheel in adk_submission-0.2.13-py3-none-any.whl google_adk-1.36.1-py3-none-any.whl adk_eval_core-0.1.0-py3-none-any.whl swegemma-0.2.11-py3-none-any.whl; do
            kaggle datasets download -d metric/gemma-4-developer-agent-wheelhouse -f "$wheel" -p /tmp/solver-v3r-wheels --unzip >/dev/null
          done
          python -m pip install -q --disable-pip-version-check /tmp/solver-v3r-wheels/*.whl
          kaggle kernels output lynnsakurai/gemma-4-budget-fit-agent-w-bounded-rescue/2 -p /tmp/solver-v3r-source -o >/dev/null
          python -m scripts.build_solver_v3r_candidate             --source-zip /tmp/solver-v3r-source/submission.zip             --out /tmp/solver-v3r-submission.zip
          python -m scripts.verify_solver_v3r_official --zip /tmp/solver-v3r-submission.zip
          echo "SOLVER_V3R_NO_GPU_NO_OFFICIAL_SUBMISSION=TRUE"

# v3r: run green gate against executable bundled skill and compiler

# v3r: rerun after actual pytest-regression witness fixes
