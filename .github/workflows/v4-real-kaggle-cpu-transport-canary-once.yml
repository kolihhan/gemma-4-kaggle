name: V4 real Kaggle CPU canary read-only v2 recovery
on:
  push:
    branches: [research/dual-agent-recovery-v0-20261108]
    paths:
      - .github/workflows/v4-real-kaggle-cpu-transport-canary-once.yml

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify REAL recorded Kaggle push identity, read private v2 status and output
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0"
          python -m unittest -v tests.test_solver_v4_submission_kernel_version
          python - <<'PY'
          import hashlib
          import json
          import tempfile
          import time
          from pathlib import Path
          from types import SimpleNamespace
          from kaggle.api.kaggle_api_extended import KaggleApi
          from scripts import submit_solver_v4_cgr_once as v4

          slug="kolihhan/gemma4-v4-cpu-transport-canary-20261111"
          # Replays the exact SDK ref/URL/version shape from the authenticated
          # push recorded in Actions 42873480975. NO NEW KERNEL PUSH.
          response=SimpleNamespace(
              ref="/code/"+slug,
              url="https://www.kaggle.com/code/"+slug,
              versionNumber=2,version_number=2,error=""
          )
          v4.KERNEL=slug
          version=v4.verified_kernel_version(response)
          assert version==2
          print("V4_CANARY_REAL_RESPONSE_SHAPE_VALIDATED=TRUE",flush=True)
          api=KaggleApi()
          api.authenticate()
          pinned=f"{slug}/{version}"
          with tempfile.TemporaryDirectory(prefix="v4-canary-readonly-") as temp:
              root=Path(temp)
              # This queries the actual private notebook, NOT a mock.
              source=root/"source"
              source.mkdir()
              api.kernels_pull(pinned,str(source),metadata=True,quiet=True)
              metadata=json.loads((source/"kernel-metadata.json").read_text())
              assert metadata["id"]==slug,metadata["id"]
              print("V4_CANARY_VERSIONED_SOURCE_PULLED=TRUE",flush=True)
              state="UNKNOWN"
              for _ in range(18):
                  status=api.kernels_status(pinned)
                  state=str(getattr(status,"status","UNKNOWN"))
                  if "COMPLETE" in state:break
                  if any(w in state for w in ("ERROR","FAILED","CANCELLED")):
                      raise RuntimeError("CANARY_KERNEL_ERROR:"+state)
                  time.sleep(6)
              print("V4_CANARY_VERSION2_AUTHENTICATED_STATUS="+state,flush=True)
              if "COMPLETE" not in state:
                  print("V4_CANARY_READ_ONLY_OUTPUT_NOT_READY=TRUE",flush=True)
              else:
                  output=root/"output"
                  output.mkdir()
                  api.kernels_output(pinned,str(output),force=True,quiet=True)
                  expected=b"gemma4-v4-cpu-transport-canary:2026-11-11\n"
                  observed=(output/"v4-transport-canary.txt").read_bytes()
                  if observed!=expected:raise RuntimeError("CANARY_WRONG_VERSION_OR_OUTPUT")
                  print("V4_CANARY_REAL_PRIVATE_VERSION2_OUTPUT_VERIFIED_SHA256="+hashlib.sha256(observed).hexdigest(),flush=True)
              print("V4_CANARY_READ_ONLY_NO_PUSH_NO_SUBMISSION_NO_GPU=TRUE",flush=True)
          PY
