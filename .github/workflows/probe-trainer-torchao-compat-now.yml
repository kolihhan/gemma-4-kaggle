name: Probe trainer torchao compatibility once

on:
  push:
    branches: [exp/verifier-lora-v0]
    paths:
      - .github/workflows/probe-trainer-torchao-compat-now.yml

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KERNEL_DIR: /tmp/trainer-torchao-compat-probe
  OUTPUT_DIR: /tmp/trainer-torchao-compat-probe-output
  KERNEL_REF: kolihhan/gemma4-trainer-torchao-probe-${{ github.run_id }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render current trainer compatibility probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$KERNEL_DIR" "$OUTPUT_DIR"
          mkdir -p "$KERNEL_DIR" "$OUTPUT_DIR"
          python - <<'PY'
          import base64
          from pathlib import Path

          source_b64 = base64.b64encode(Path("kaggle/train_verifier_lora.py").read_bytes()).decode("ascii")
          lines = [
              "import base64",
              "import json",
              "import types",
              f"SOURCE_B64 = {source_b64!r}",
              "trainer = types.ModuleType('train_verifier_lora')",
              "trainer.__dict__['__name__'] = 'train_verifier_lora'",
              "exec(compile(base64.b64decode(SOURCE_B64), 'train_verifier_lora.py', 'exec'), trainer.__dict__)",
              "compat = trainer.ensure_peft_torchao_compat()",
              "from transformers import GPT2Config, AutoModelForCausalLM",
              "from peft import LoraConfig, get_peft_model",
              "config = GPT2Config(vocab_size=32, n_positions=16, n_ctx=16, n_embd=8, n_layer=1, n_head=1)",
              "model = AutoModelForCausalLM.from_config(config)",
              "peft_config = LoraConfig(r=2, lora_alpha=4, target_modules=['c_attn'], task_type='CAUSAL_LM')",
              "wrapped = get_peft_model(model, peft_config)",
              "trainable = sum(p.numel() for p in wrapped.parameters() if p.requires_grad)",
              "result = {'compat': compat, 'trainable': trainable}",
              "assert compat == {'torchao_version': '0.10.0', 'action': 'uninstalled_incompatible'}, result",
              "assert trainable > 0, result",
              "print('TRAINER_TORCHAO_COMPAT_SMOKE', json.dumps(result, sort_keys=True))",
          ]
          Path('/tmp/trainer-torchao-compat-probe/probe.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          cat > "$KERNEL_DIR/kernel-metadata.json" <<EOF
          {
            "id": "${KERNEL_REF}",
            "title": "gemma4-trainer-torchao-probe-${GITHUB_RUN_ID}",
            "code_file": "probe.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": false,
            "enable_tpu": false,
            "enable_internet": false,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0'

      - name: Push private CPU probe
        run: kaggle kernels push -p "$KERNEL_DIR" -t 900

      - name: Poll probe
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          terminal=""
          for attempt in $(seq 1 60); do
            status="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "[$attempt] $status"
            lower="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
            if grep -Eq 'complete|completed' <<<"$lower"; then terminal="complete"; break; fi
            if grep -Eq 'error|failed|failure|cancelled|canceled' <<<"$lower"; then terminal="error"; break; fi
            sleep 10
          done
          [[ -n "$terminal" ]] || terminal="timeout"
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          test "$terminal" = "complete"

      - name: Collect probe logs
        if: always()
        shell: bash
        run: |
          set +e
          kaggle kernels logs "$KERNEL_REF" > "$OUTPUT_DIR/kernel.log" 2>&1
          cat "$OUTPUT_DIR/kernel.log" || true

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-torchao-compat-probe-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 7
