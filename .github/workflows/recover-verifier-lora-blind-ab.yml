name: Discover frozen blind BASE kernel

on:
  push:
    branches:
      - exp/public-train-once
    paths:
      - .github/workflows/recover-verifier-lora-blind-ab.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: List recent kernels for owner
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels list --user kolihhan --page-size 100 | tee /tmp/kernels.txt
          echo '--- matching blind / run-id ---'
          grep -Ei '41434071381|blind|verifier' /tmp/kernels.txt || true
