name: Probe frozen blind BASE status

on:
  push:
    branches:
      - exp/public-train-once
    paths:
      - .github/workflows/recover-verifier-lora-blind-ab.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Query BASE kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL_REF: kolihhan/gemma4-verifier-blind-base-41434071381
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels status "$KERNEL_REF"
