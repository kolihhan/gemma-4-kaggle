name: Gemma Evidence Budget - actionable policy and scoreable candidate CPU gate
on:
  push:
    branches: [research/evidence-budget-policy-20261122]
    paths:
      - scripts/gemma_evidence_budget_policy_20261122.py
      - scripts/build_gemma_evidence_budget_candidate_20261122.py
      - .github/workflows/gemma_evidence_budget_cpu_once_20261122.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cpu-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deterministic real decision-policy unit tests
        run: |
          python -m py_compile scripts/gemma_evidence_budget_policy_20261122.py scripts/build_gemma_evidence_budget_candidate_20261122.py
          python -m scripts.gemma_evidence_budget_policy_20261122 --test
          python -m scripts.gemma_evidence_budget_policy_20261122 --events-json '[{"action":"search","paths":["app/handler.py"]},{"action":"read","paths":["app/handler.py"],"source_evidence":true},{"action":"edit","patch_changed":true},{"action":"test","test_outcome":"pass"}]' --calls-left 12 --seconds-left 90
      - name: Install Kaggle CLI to fetch only public control code
        run: python -m pip install --disable-pip-version-check -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Pin official 0.18 code source and construct CPU-only candidate
        run: |
          test -n "${KAGGLE_API_TOKEN:-}"
          mkdir -p /tmp/gemma-public-control
          kaggle kernels output lynnsakurai/gemma-4-budget-fit-agent-w-bounded-rescue/2 -p /tmp/gemma-public-control -o > /tmp/gemma-kaggle-code-log 2>&1
          python -c 'from pathlib import Path; import json; from scripts.build_gemma_evidence_budget_candidate_20261122 import build_candidate; files=list(Path("/tmp/gemma-public-control").rglob("submission.zip")); assert len(files)==1, "public source ZIP missing"; out,meta=build_candidate(files[0].read_bytes()); assert meta["model"]=="gemma-4-31b-it-qat-w4a16-ct" and not meta["official_submission"]; print("GEMMA_EVIDENCE_BUDGET_REAL_CONTROL_PACKAGING="+json.dumps(meta,sort_keys=True)); assert len(out)>0'
          rm -rf /tmp/gemma-public-control /tmp/gemma-kaggle-code-log
      - name: No GPU, no grader, no Kaggle submit
        if: always()
        run: echo GEMMA_EVIDENCE_BUDGET_CPU_ONLY_NO_MODEL_NO_SUBMISSION=TRUE
