name: Inspect current adk-submission wheel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-adk-submission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --upgrade kaggle
      - name: Download only current adk-submission wheel and inspect nested model discovery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/adk-wheel /tmp/adk-src
          mkdir -p /tmp/adk-wheel /tmp/adk-src
          kaggle datasets files metric/gemma-4-developer-agent-wheelhouse --page-size 200 > /tmp/wheel-files.txt
          wheel="$(awk 'tolower($0) ~ /adk[_-]submission/ && $0 ~ /\.whl/ {print $1; exit}' /tmp/wheel-files.txt)"
          test -n "$wheel"
          echo "wheel=$wheel"
          kaggle datasets download -d metric/gemma-4-developer-agent-wheelhouse -f "$wheel" -p /tmp/adk-wheel --unzip
          actual="$(find /tmp/adk-wheel -type f -name '*adk*submission*.whl' | head -n1)"
          test -n "$actual"
          python -m zipfile -e "$actual" /tmp/adk-src

          echo '--- discover_declared_models ---'
          sed -n '640,805p' /tmp/adk-src/adk_submission/discovery.py
          echo '--- CompilationContext.resolve_sub_config_path ---'
          sed -n '80,135p' /tmp/adk-src/adk_submission/context.py
          echo '--- workflow compiler ---'
          sed -n '215,275p' /tmp/adk-src/adk_submission/compiler.py
          sed -n '35,90p' /tmp/adk-src/adk_submission/builders/workflows.py
          sed -n '35,85p' /tmp/adk-src/adk_submission/builders/sub_agents.py
