name: Inspect current adk-submission wheel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-adk-submission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --upgrade kaggle
      - name: Download only current adk-submission wheel and inspect discovery/compiler source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/adk-wheel /tmp/adk-src
          kaggle datasets files metric/gemma-4-developer-agent-wheelhouse --page-size 200 > /tmp/wheel-files.txt
          cat /tmp/wheel-files.txt | grep -i 'adk.submission\|adk_submission' || true
          wheel="$(awk 'tolower($0) ~ /adk[_-]submission/ && $0 ~ /\.whl/ {print $1; exit}' /tmp/wheel-files.txt)"
          if [[ -z "$wheel" ]]; then
            echo "Could not locate adk-submission wheel" >&2
            cat /tmp/wheel-files.txt
            exit 1
          fi
          echo "wheel=$wheel"
          kaggle datasets download -d metric/gemma-4-developer-agent-wheelhouse -f "$wheel" -p /tmp/adk-wheel --unzip
          actual="$(find /tmp/adk-wheel -type f -name '*adk*submission*.whl' -o -name '*.whl' | head -n1)"
          echo "actual=$actual"
          python -m zipfile -e "$actual" /tmp/adk-src
          echo '--- discovery.py ---'
          sed -n '1,260p' /tmp/adk-src/adk_submission/discovery.py
          echo '--- config/compiler references ---'
          grep -RniE 'SequentialAgent|config_path|discover_declared_models|validate_single_declared_model' /tmp/adk-src/adk_submission | head -n 240
