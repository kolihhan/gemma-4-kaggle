name: Check Kaggle baseline submission status once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      COMPETITION: gemma-4-developer-agent

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Kaggle CLI
        run: |
          python -m pip install --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0'
          kaggle --version

      - name: Show latest competition submissions
        shell: bash
        run: |
          set -euo pipefail
          kaggle competitions submissions "$COMPETITION" --page-size 10
