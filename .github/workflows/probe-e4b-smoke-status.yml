name: Probe E4B smoke status

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-e4b-smoke-status.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: kolihhan/gemma4-e4b-smoke
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --upgrade kaggle
      - name: Enumerate kernels available to this token
        shell: bash
        run: |
          set +e
          echo '--- kernels list help ---'
          kaggle kernels list --help
          echo '--- list own/user kernels via CLI ---'
          kaggle kernels list --user kolihhan --sort-by dateRun --page-size 50
          echo '--- inspect Python API signature and results ---'
          python - <<'PY'
          import inspect
          from kaggle.api.kaggle_api_extended import KaggleApi

          api = KaggleApi()
          api.authenticate()
          print('kernels_list signature:', inspect.signature(api.kernels_list))
          attempts = [
              {'user': 'kolihhan', 'page_size': 50},
              {'user': 'kolihhan', 'search': 'gemma4-e4b-smoke', 'page_size': 50},
              {'search': 'Gemma 4 E4B One-Task Smoke', 'page_size': 50},
          ]
          for kwargs in attempts:
              print('QUERY', kwargs)
              try:
                  rows = api.kernels_list(**kwargs)
                  for row in rows:
                      print(row)
              except Exception as exc:
                  print(type(exc).__name__, exc)
          PY
          echo '--- direct status retry ---'
          kaggle kernels status "$KERNEL_REF"
