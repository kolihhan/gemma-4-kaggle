# Read-only status probe for the current coder-verifier experiment.
name: Probe E4B smoke status

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-e4b-smoke-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: kolihhan/gemma-4-e4b-one-task-smoke
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --upgrade kaggle
      - name: Read private kernel status only
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels status "$KERNEL_REF"
