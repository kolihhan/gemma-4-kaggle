name: Probe E4B smoke status

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-e4b-smoke-status.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: kolihhan/gemma-4-e4b-one-task-smoke
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --upgrade kaggle
      - name: Read canonicalized private kernel state
        shell: bash
        run: |
          set +e
          echo '--- status ---'
          kaggle kernels status "$KERNEL_REF"
          echo '--- logs ---'
          kaggle kernels logs "$KERNEL_REF"
          echo '--- output listing/download ---'
          rm -rf /tmp/smoke-probe-output
          mkdir -p /tmp/smoke-probe-output
          kaggle kernels output "$KERNEL_REF" -p /tmp/smoke-probe-output -o
          find /tmp/smoke-probe-output -maxdepth 3 -type f -printf '%P %s bytes\n' | sort
          if [[ -f /tmp/smoke-probe-output/smoke_result.json ]]; then
            echo '--- smoke_result.json ---'
            cat /tmp/smoke-probe-output/smoke_result.json
          fi
