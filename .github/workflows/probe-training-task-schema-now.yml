name: Probe training task schema once

on:
  push:
    branches: [exp/verifier-lora-v0]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect one known training task schema without printing patch contents
        shell: python
        run: |
          import json
          from pathlib import Path

          target = "fastapi_14479"
          found = None
          parsed = []
          text = Path("tasks.jsonl").read_text(encoding="utf-8")
          try:
              obj = json.loads(text)
              if isinstance(obj, list):
                  parsed = obj
              elif isinstance(obj, dict):
                  parsed = [obj]
          except json.JSONDecodeError:
              parsed = [json.loads(line) for line in text.splitlines() if line.strip()]

          def contains_target(x):
              if isinstance(x, dict):
                  return any(contains_target(v) for v in x.values())
              if isinstance(x, list):
                  return any(contains_target(v) for v in x)
              return x == target

          for rec in parsed:
              if contains_target(rec):
                  found = rec
                  break

          if found is None:
              raise SystemExit(f"training task {target!r} not found")

          print("top_level_keys=", sorted(found.keys()))
          needles = ("patch", "gold", "reference", "solution", "answer", "diff")

          def walk(x, path="$"):
              if isinstance(x, dict):
                  for k, v in x.items():
                      p = f"{path}.{k}"
                      if any(n in k.lower() for n in needles):
                          if isinstance(v, str):
                              print(f"candidate_field path={p} type=str length={len(v)} nonempty={bool(v.strip())}")
                          elif isinstance(v, (list, dict)):
                              print(f"candidate_field path={p} type={type(v).__name__} length={len(v)}")
                          else:
                              print(f"candidate_field path={p} type={type(v).__name__} value_present={v is not None}")
                      walk(v, p)
              elif isinstance(x, list):
                  for i, v in enumerate(x):
                      walk(v, f"{path}[{i}]")

          walk(found)
