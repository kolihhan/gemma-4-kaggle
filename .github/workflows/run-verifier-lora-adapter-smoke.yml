name: Smoke frozen verifier-only LoRA adapter (private Kaggle)

on:
  push:
    branches: [exp/verifier-lora-v0]
    paths:
      - "experiments/verifier-lora-adapter-smoke-v0-trigger.txt"

permissions:
  contents: read

concurrency:
  group: verifier-lora-adapter-smoke-v0
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: kolihhan/gemma4-verifier-adapter-smoke-v0-${{ github.run_id }}
      KERNEL_DIR: /tmp/verifier-adapter-smoke-kernel
      OUTPUT_DIR: /tmp/verifier-adapter-smoke-output

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render private one-task Kaggle adapter smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$KERNEL_DIR" "$OUTPUT_DIR"
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          sub = root / "submission"
          payload = {
              path.relative_to(sub).as_posix(): path.read_text(encoding="utf-8")
              for path in sorted(sub.rglob("*"))
              if path.is_file()
          }
          if "agent.yaml" not in payload or "sub_agents/verifier.yaml" not in payload:
              raise SystemExit("missing canonical candidate")
          if any(name.startswith("adapters/") for name in payload):
              raise SystemExit("adapter must never be committed into the canonical submission")
          if "adapter:" in payload["agent.yaml"] or "adapter:" in payload["sub_agents/verifier.yaml"]:
              raise SystemExit("source submission must remain base-only")

          contract = json.loads(
              (root / "docs/evaluation/verifier-lora-eval-contract-v1.json").read_text(encoding="utf-8")
          )
          if "rich_3067" not in contract["development_validation"]["instance_ids"]:
              raise SystemExit("smoke task is not verified development-seen")
          if "rich_3067" in contract["blind_evaluation"]["instance_ids"]:
              raise SystemExit("smoke task intersects frozen blind reservation")

          manifest = {"version": "verifier-lora-v0", "holdout": [{"instance_id": "rich_3067"}]}
          source = (root / "kaggle/verifier_lora_adapter_runtime.py").read_text(encoding="utf-8")
          submission_marker = "__SUBMISSION_PAYLOAD_B64__"
          manifest_marker = 'HOLDOUT_MANIFEST_JSON = "__VERIFIER_LORA_HOLDOUT_MANIFEST_JSON__"'
          if source.count(submission_marker) != 1 or source.count(manifest_marker) != 1:
              raise SystemExit("invalid smoke template markers")
          encoded = base64.b64encode(
              json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).decode("ascii")
          source = source.replace(submission_marker, encoded, 1)
          source = source.replace(
              manifest_marker,
              f"HOLDOUT_MANIFEST_JSON = {json.dumps(manifest, sort_keys=True)!r}",
              1,
          )
          dest = Path(os.environ["KERNEL_DIR"])
          compile(source, "verifier_lora_adapter_runtime.py", "exec")
          (dest / "verifier_lora_adapter_runtime.py").write_text(source, encoding="utf-8")
          metadata = {
              "id": os.environ["KERNEL_REF"],
              "title": os.environ["KERNEL_REF"].split("/")[1],
              "code_file": "verifier_lora_adapter_runtime.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_tpu": False,
              "enable_internet": False,
              "machine_shape": "NvidiaL4",
              "docker_image": "gcr.io/kaggle-private-byod/python@sha256:37c64f7dd9c54116ecd1bcc88817c5469b88387388fade02bfa8bf3fc647d461",
              "dataset_sources": ["metric/gemma-4-developer-agent-wheelhouse"],
              "competition_sources": ["gemma-4-developer-agent"],
              "kernel_sources": ["kolihhan/gemma4-verifier-lora-v0-41398395423"],
              "model_sources": ["google/gemma-4/Other/gemma-4-e4b-it-qat-w4a16-ct/2"],
          }
          (dest / "kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          print("source_variant=base E4B coder + hashed verifier LoRA only")
          print("adapter_kernel=kolihhan/gemma4-verifier-lora-v0-41398395423")
          print("evaluation_task=rich_3067 (development-seen, not blind)")
          PY

      - name: Install pinned Kaggle CLI
        run: |
          python -m pip install --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0"
          kaggle --version

      - name: Push private Kaggle adapter smoke
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p "$KERNEL_DIR" -t 1800

      - name: Poll until Kaggle is terminal
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          terminal=""
          for attempt in $(seq 1 105); do
            status_output="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "[$attempt] $status_output"
            lower="$(echo "$status_output" | tr '[:upper:]' '[:lower:]')"
            if grep -Eq 'complete|completed' <<<"$lower"; then terminal="complete"; break; fi
            if grep -Eq 'error|failed|failure|cancelled|canceled' <<<"$lower"; then terminal="error"; break; fi
            sleep 20
          done
          echo "terminal=${terminal:-timeout}" >> "$GITHUB_OUTPUT"

      - name: Collect summary only (no raw traces or patches)
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$OUTPUT_DIR"
          kaggle kernels output "$KERNEL_REF" -p "$OUTPUT_DIR" -o --file-pattern '.*verifier_adapter_smoke_results.json' >/dev/null 2>&1
          test -s "$OUTPUT_DIR/verifier_adapter_smoke_results.json" || echo "Summary not yet available; inspect private Kaggle kernel for errors"

      - name: Assert frozen adapter and real evaluator execution
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.poll.outputs.terminal }}" = "complete"
          test -s "$OUTPUT_DIR/verifier_adapter_smoke_results.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["OUTPUT_DIR"]) / "verifier_adapter_smoke_results.json"
          output = json.loads(path.read_text(encoding="utf-8"))
          assert output["version"] == "verifier-lora-v0", output
          assert output["model"] == "gemma-4-e4b-it-qat-w4a16-ct", output
          assert output["variant"] == "verifier_lora_v0", output
          assert output["adapter_weights_sha256"] == "3b8e4a90cb3eb718a07ec3c8d53705e0bcc21fa84aeae819ad12ad5ff8bcc199", output
          assert output["requested"] == 1, output
          assert len(output["results"]) == 1, output
          assert output["results"][0]["instance_id"] == "rich_3067", output
          assert output["results"][0]["status"] == "completed", output
          forbidden = {"agent_patch", "reference_patch", "test_patch", "solution_patch"}
          assert forbidden.isdisjoint(output["results"][0]), output
          print(json.dumps({k:v for k,v in output.items() if k != "results"}, sort_keys=True))
          print("SMOKE_TASK_METRICS", json.dumps(output["results"][0], sort_keys=True))
          PY

      - name: Upload metrics-only smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-lora-adapter-smoke-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/verifier_adapter_smoke_results.json
          if-no-files-found: warn
          retention-days: 30
