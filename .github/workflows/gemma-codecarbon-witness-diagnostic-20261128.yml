name: Gemma CodeCarbon witness diagnostic CPU
on:
  push:
    branches: [research/independent-reset-20261128]
    paths: [.github/workflows/gemma-codecarbon-witness-diagnostic-20261128.yml]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.head_commit.message == 'GO_CODECARBON_WITNESS_DIAGNOSTIC_CPU_20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose full-runtime failure and run source-slice controls
        run: |
          set -euo pipefail
          python -m pip install -q datasets
          python - <<'PY'
          import json,subprocess,tempfile,re
          from pathlib import Path
          from datasets import load_dataset
          row=next(r for r in load_dataset("SWE-bench-Live/SWE-bench-Live",split="test",revision="babb27e45e072219195db7a744bbf0d3c1a36e56") if r["instance_id"]=="mlco2__codecarbon-831")
          assert row["base_commit"]=="62bd43400518892c46e0ac29745fc3112bd6c72a"
          tag="starryzhang/sweb.eval.x86_64.mlco2_1776_codecarbon-831:latest"
          image="sha256:736b34b8082758bf1b2b5dd0fc36ecc5bbe92a3e3631f9b487a1f7bc6f617881"
          def call(args,timeout=90):
              return subprocess.run(args,capture_output=True,text=True,timeout=timeout,check=True).stdout.strip()
          call(["docker","pull",tag],300)
          assert call(["docker","image","inspect",tag,"--format","{{.Id}}"])==image
          results={}
          for variant in ("base_a","base_b","gold"):
              c=None; stage="create"
              rec={}
              with tempfile.TemporaryDirectory() as tmp:
                  try:
                      c=call(["docker","create","--network","none","--cap-drop","ALL","--security-opt","no-new-privileges","--pids-limit","256","--memory","5g","--cpus","2","--entrypoint","/bin/bash",image,"-c","sleep infinity"])
                      stage="start";call(["docker","start",c])
                      stage="base_commit";assert call(["docker","exec","-w","/testbed",c,"git","rev-parse","HEAD"])==row["base_commit"]
                      if variant=="gold":
                          stage="apply_reference"
                          p=Path(tmp)/"ref.diff";p.write_text(row["patch"].rstrip("\n")+"\n")
                          call(["docker","cp",str(p),c+":/tmp/ref.diff"])
                          call(["docker","exec","-w","/testbed",c,"git","apply","--recount","/tmp/ref.diff"])
                          call(["docker","exec",c,"rm","/tmp/ref.diff"])
                      stage="discover_python"
                      discovered=call(["docker","exec",c,"/bin/bash","-c","command -v python || command -v python3 || find /opt -type f -name python3 -print -quit"])
                      assert discovered.startswith("/") and "\n" not in discovered
                      rec["python"]=discovered
                      for mode,script,marker in [("full","witness_codecarbon_830_20261128.py","ISSUE_WITNESS="),("slice","witness_codecarbon_source_slice_20261128.py","SLICE_WITNESS=")]:
                          stage="copy_"+mode
                          call(["docker","cp",str(Path("scripts")/script),c+":/tmp/issue_witness.py"])
                          stage="exec_"+mode
                          try:
                              output=call(["docker","exec","-w","/testbed","-e","PYTHONPATH=/testbed",c,discovered,"/tmp/issue_witness.py"],60)
                              lines=[x for x in output.splitlines() if x.startswith(marker)]
                              assert len(lines)==1
                              rec[mode]=json.loads(lines[0].split("=",1)[1])
                          except subprocess.CalledProcessError as e:
                              rec[mode]={"blocked":stage,"exit":e.returncode,"diagnostic":(e.stderr or e.stdout or "")[-1200:]}
                          except Exception as e:
                              rec[mode]={"blocked":stage,"type":type(e).__name__}
                  except subprocess.CalledProcessError as e:
                      rec["blocked"]={"stage":stage,"exit":e.returncode,"diagnostic":(e.stderr or e.stdout or "")[-1000:]}
                  except Exception as e:
                      rec["blocked"]={"stage":stage,"type":type(e).__name__}
                  finally:
                      if c: subprocess.run(["docker","rm","-f",c],capture_output=True)
              results[variant]=rec
              print("DIAGNOSTIC_WITNESS="+json.dumps({"variant":variant,"result":rec}),flush=True)
          def numeric(rows,label):
              return isinstance(rows,list) and any(x.get("input")==label and x.get("outcome")=="VALUE" and x.get("power")==22.5 for x in rows)
          def failure(rows):
              return isinstance(rows,list) and any(x.get("input")=="config_file" and x.get("outcome")=="EXCEPTION" and x.get("issue_error_match") is True for x in rows)
          gates={}
          for mode in ("full","slice"):
              a,b,g=[results[k].get(mode) for k in ("base_a","base_b","gold")]
              gates[mode]=bool(isinstance(a,list) and a==b and numeric(a,"constructor") and failure(a) and numeric(g,"constructor") and numeric(g,"config_file"))
          print("DIAGNOSTIC_GATE="+json.dumps({"gates":gates,"source_slice_is_not_integration":True,"manual":True,"gpu":False,"inference":False,"submission":False}),flush=True)
          assert any(gates.values()),"No actual witness gate passed"
          PY
