name: Probe PEFT torchao workaround once

on:
  push:
    branches: [exp/verifier-lora-v0]
    paths:
      - .github/workflows/probe-peft-torchao-workaround.yml

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KERNEL_DIR: /tmp/peft-torchao-probe
  OUTPUT_DIR: /tmp/peft-torchao-probe-output
  KERNEL_REF: kolihhan/gemma4-peft-torchao-probe-${{ github.run_id }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render CPU-only PEFT probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$KERNEL_DIR" "$OUTPUT_DIR"
          mkdir -p "$KERNEL_DIR" "$OUTPUT_DIR"
          cat > "$KERNEL_DIR/probe.py" <<'PY'
          import importlib.metadata
          import json
          import subprocess
          import sys

          before = subprocess.run(
              [sys.executable, "-c", "from peft.import_utils import is_torchao_available; print(is_torchao_available())"],
              text=True,
              capture_output=True,
          )
          uninstall = subprocess.run(
              [sys.executable, "-m", "pip", "uninstall", "-y", "torchao"],
              text=True,
              capture_output=True,
          )
          toy_code = r'''
          import json
          from transformers import GPT2Config, AutoModelForCausalLM
          from peft import LoraConfig, get_peft_model
          from peft.import_utils import is_torchao_available

          config = GPT2Config(vocab_size=32, n_positions=16, n_ctx=16, n_embd=8, n_layer=1, n_head=1)
          model = AutoModelForCausalLM.from_config(config)
          peft_config = LoraConfig(r=2, lora_alpha=4, target_modules=["c_attn"], task_type="CAUSAL_LM")
          wrapped = get_peft_model(model, peft_config)
          trainable = sum(p.numel() for p in wrapped.parameters() if p.requires_grad)
          print("TOY_LORA_OK", json.dumps({"torchao_available": is_torchao_available(), "trainable": trainable}, sort_keys=True))
          assert trainable > 0
          '''
          after = subprocess.run([sys.executable, "-c", toy_code], text=True, capture_output=True)
          result = {
              "torchao_version_before": importlib.metadata.version("torchao") if before.returncode == 0 else "0.10.0-or-present",
              "before_returncode": before.returncode,
              "before_stdout": before.stdout.strip(),
              "before_stderr_tail": before.stderr.strip()[-500:],
              "uninstall_returncode": uninstall.returncode,
              "uninstall_stdout_tail": uninstall.stdout.strip()[-500:],
              "after_returncode": after.returncode,
              "after_stdout": after.stdout.strip(),
              "after_stderr_tail": after.stderr.strip()[-1000:],
          }
          print("PEFT_TORCHAO_PROBE", json.dumps(result, sort_keys=True))
          if before.returncode == 0:
              raise SystemExit("expected old torchao availability check to fail in this runtime")
          if uninstall.returncode != 0:
              raise SystemExit("torchao uninstall failed")
          if after.returncode != 0 or "TOY_LORA_OK" not in after.stdout:
              raise SystemExit("PEFT toy LoRA still failed after removing old torchao")
          PY
          cat > "$KERNEL_DIR/kernel-metadata.json" <<EOF
          {
            "id": "${KERNEL_REF}",
            "title": "gemma4-peft-torchao-probe-${GITHUB_RUN_ID}",
            "code_file": "probe.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": false,
            "enable_tpu": false,
            "enable_internet": false,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0'
      - name: Push private CPU probe
        run: kaggle kernels push -p "$KERNEL_DIR" -t 900
      - name: Poll probe
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          terminal=""
          for attempt in $(seq 1 60); do
            status="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "[$attempt] $status"
            lower="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
            if grep -Eq 'complete|completed' <<<"$lower"; then terminal="complete"; break; fi
            if grep -Eq 'error|failed|failure|cancelled|canceled' <<<"$lower"; then terminal="error"; break; fi
            sleep 10
          done
          [[ -n "$terminal" ]] || terminal="timeout"
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          test "$terminal" = "complete"
      - name: Collect logs
        if: always()
        shell: bash
        run: |
          set +e
          kaggle kernels logs "$KERNEL_REF" > "$OUTPUT_DIR/kernel.log" 2>&1
          cat "$OUTPUT_DIR/kernel.log" || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peft-torchao-probe-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 7
