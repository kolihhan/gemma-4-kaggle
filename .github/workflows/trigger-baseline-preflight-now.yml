name: Trigger baseline preflight now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-baseline-preflight-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch baseline preflight on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate-baseline-submission.yml --repo '${{ github.repository }}' --ref main
