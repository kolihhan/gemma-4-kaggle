name: Gemma PRO textonly 31B six-pair frozen CPU gate
on:
  push:
    branches:
      - research/dual-agent-recovery-v0-20261108
    paths:
      - .github/workflows/gemma-pro-textonly31b-paired6-cpu-gate-20261116.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze and validate scored candidate source without GPU
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_gemma_31b_textonly_search_v0_20261116.py scripts/render_gemma_textonly31b_paired6_20261116.py
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.render_gemma_textonly31b_paired6_20261116 import validate_manifest
          spec=json.loads(Path('experiments/solver-v3/pro-textonly31b-independent6-20261116.json').read_text())
          validate_manifest(spec)
          assert spec['experiment']['tasks']==6
          assert spec['selection']['previous_pilot_salt'] != spec['selection']['salt'] and spec['selection']['previous_semantic_salt'] != spec['selection']['salt']
          assert spec['resource']['official_competition_submit'] is False
          print('GEMMA_TEXTONLY_CPU_FROZEN_CONTRACT=PASS')
          PY
          test -n "${KAGGLE_API_TOKEN:-}" || { echo GEMMA_TEXTONLY_CPU_STOP=MISSING_KAGGLE_AUTH; exit 1; }
          python -m pip install -q kaggle==2.2.5 six==1.17.0
          mkdir -p /tmp/gemma-textonly-src
          if ! kaggle kernels output lynnsakurai/gemma-4-budget-fit-agent-w-bounded-rescue/2 -p /tmp/gemma-textonly-src -o >/tmp/gemma-textonly-source-fetch.log 2>&1; then
            echo GEMMA_TEXTONLY_CPU_STOP=FROZEN_PUBLIC_SOURCE_UNAVAILABLE
            exit 1
          fi
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from scripts.build_gemma_31b_textonly_search_v0_20261116 import build
          source=Path('/tmp/gemma-textonly-src/submission.zip').read_bytes()
          print('GEMMA_TEXTONLY_FROZEN_CANDIDATE_ZIP_SHA256='+hashlib.sha256(build(source)).hexdigest(),flush=True)
          PY
          python -m scripts.render_gemma_textonly31b_paired6_20261116 --repo . --source-zip /tmp/gemma-textonly-src/submission.zip --out /tmp/gemma-textonly-frozen-cpu --kernel-ref kolihhan/gemma4-textonly31b-six-nov16
          python -m py_compile /tmp/gemma-textonly-frozen-cpu/paired_textonly31b_runtime.py
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/gemma-textonly-frozen-cpu')
          meta=json.loads((root/'kernel-metadata.json').read_text())
          assert meta['is_private'] and meta['enable_gpu'] and not meta['enable_internet']
          assert meta['model_sources']==['google/gemma-4/Other/gemma-4-31b-it-qat-w4a16-ct/2']
          code=(root/meta['code_file']).read_text()
          assert 'textonly_5min' in code
          assert 'v2_5min' in code
          assert 'previous_semantic_salt' in code
          assert 'PAIRED_TEXTONLY_FROZEN_SELECTED_PUBLIC_DEV_COUNT' in code
          print('GEMMA_TEXTONLY_CPU_PAIR_SCORER=PASS;NO_GPU=TRUE;NO_COMPETITION_SUBMISSION=TRUE')
          PY

# CPU rerun after frozen builder-path fix; same scientific candidate, no GPU.

# Frozen SHA recorded from authenticated CPU output. No changes to candidate.
