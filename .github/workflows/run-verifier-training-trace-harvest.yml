name: Run verifier LoRA training trace harvest

on:
  push:
    branches: [exp/verifier-lora-v0]
    paths:
      - "experiments/verifier-training-trace-harvest-v0-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemma4-verifier-training-trace-harvest-v0
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: kolihhan/gemma-4-verifier-training-trace-harvest-v0
      KERNEL_DIR: /tmp/gemma4-verifier-training-trace-harvest-v0
      OUTPUT_DIR: /tmp/gemma4-verifier-training-trace-harvest-v0-output

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0"
          python -c "import kaggle, six"

      - name: Render private verifier training trace kernel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$KERNEL_DIR" "$OUTPUT_DIR"
          mkdir -p "$KERNEL_DIR" "$OUTPUT_DIR"
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          repo = Path.cwd()
          submission = repo / "submission"
          runtime_template = repo / "kaggle" / "verifier_training_trace_runtime.py"
          manifest_path = repo / "docs" / "evaluation" / "verifier-lora-train-subset-v0.json"
          kernel_dir = Path(os.environ["KERNEL_DIR"])

          payload = {}
          for path in sorted(submission.rglob("*")):
              if path.is_file():
                  relative = path.relative_to(submission).as_posix()
                  payload[relative] = path.read_text(encoding="utf-8")
          if "agent.yaml" not in payload:
              raise SystemExit("canonical submission is missing agent.yaml")
          if any(path.startswith("adapters/") for path in payload):
              raise SystemExit("training trace harvest must use base submission without adapters")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("version") != "verifier-lora-v0-train-harvest":
              raise SystemExit(f"unexpected training manifest version: {manifest.get('version')!r}")
          if manifest.get("source_split_version") != "verifier-lora-v0":
              raise SystemExit(
                  f"unexpected source split version: {manifest.get('source_split_version')!r}"
              )
          tasks = manifest.get("tasks")
          if not isinstance(tasks, list) or len(tasks) != 18:
              raise SystemExit(f"expected exactly 18 frozen training tasks, got {len(tasks or [])}")
          task_ids = [str(item.get("instance_id") or "") for item in tasks]
          if any(not task_id for task_id in task_ids) or len(task_ids) != len(set(task_ids)):
              raise SystemExit("training manifest contains invalid or duplicate task IDs")

          encoded_submission = base64.b64encode(
              json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).decode("ascii")
          manifest_text = json.dumps(manifest, sort_keys=True)

          template = runtime_template.read_text(encoding="utf-8")
          submission_marker = "__SUBMISSION_PAYLOAD_B64__"
          manifest_assignment = (
              'TRAINING_MANIFEST_JSON = "__VERIFIER_LORA_TRAINING_MANIFEST_JSON__"'
          )
          if template.count(submission_marker) != 1:
              raise SystemExit(
                  f"unexpected submission placeholder count: {template.count(submission_marker)}"
              )
          if template.count(manifest_assignment) != 1:
              raise SystemExit(
                  f"unexpected training manifest assignment count: {template.count(manifest_assignment)}"
              )

          rendered = template.replace(submission_marker, encoded_submission, 1)
          rendered = rendered.replace(
              manifest_assignment,
              f"TRAINING_MANIFEST_JSON = {manifest_text!r}",
              1,
          )
          compile(rendered, "verifier_training_trace_runtime.py", "exec")
          (kernel_dir / "verifier_training_trace_runtime.py").write_text(
              rendered, encoding="utf-8"
          )

          metadata = {
              "id": "kolihhan/gemma-4-verifier-training-trace-harvest-v0",
              "title": "Gemma 4 Verifier Training Trace Harvest v0",
              "code_file": "verifier_training_trace_runtime.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_tpu": False,
              "enable_internet": False,
              "machine_shape": "NvidiaL4",
              "docker_image": "gcr.io/kaggle-private-byod/python@sha256:37c64f7dd9c54116ecd1bcc88817c5469b88387388fade02bfa8bf3fc647d461",
              "dataset_sources": ["metric/gemma-4-developer-agent-wheelhouse"],
              "competition_sources": ["gemma-4-developer-agent"],
              "kernel_sources": [],
              "model_sources": [
                  "google/gemma-4/Other/gemma-4-e4b-it-qat-w4a16-ct/2"
              ],
          }
          (kernel_dir / "kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          print("rendered_submission_files=", sorted(payload))
          print("rendered_training_ids=", task_ids)
          print(
              "rendered_runtime_bytes=",
              (kernel_dir / "verifier_training_trace_runtime.py").stat().st_size,
          )
          PY

      - name: Push private Kaggle L4 training trace kernel
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p "$KERNEL_DIR" --accelerator NvidiaL4 -t 7200

      - name: Poll Kaggle kernel to terminal state
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          terminal=""
          for attempt in $(seq 1 300); do
            status_output="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            printf '[%03d] %s\n' "$attempt" "$status_output"
            lower="$(printf '%s' "$status_output" | tr '[:upper:]' '[:lower:]')"
            if grep -Eq 'complete|completed' <<<"$lower"; then
              terminal="complete"
              break
            fi
            if grep -Eq 'error|failed|failure|cancelled|canceled' <<<"$lower"; then
              terminal="error"
              break
            fi
            sleep 25
          done
          if [[ -z "$terminal" ]]; then
            terminal="timeout"
          fi
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          echo "Kaggle terminal state: $terminal"

      - name: Collect training trace logs and outputs
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$OUTPUT_DIR"
          kaggle kernels logs "$KERNEL_REF" > "$OUTPUT_DIR/kernel.log" 2>&1
          kaggle kernels output "$KERNEL_REF" -p "$OUTPUT_DIR" -o > "$OUTPUT_DIR/output-download.log" 2>&1
          echo "Collected files:"
          find "$OUTPUT_DIR" -maxdepth 5 -type f -printf '%P %s bytes\n' | sort
          if [[ -f "$OUTPUT_DIR/verifier_training_trace_results.json" ]]; then
            echo "--- verifier training trace summary ---"
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["OUTPUT_DIR"]) / "verifier_training_trace_results.json"
          result = json.loads(path.read_text(encoding="utf-8"))
          print(json.dumps({k: v for k, v in result.items() if k != "results"}, indent=2, sort_keys=True))
          PY
          fi
          echo "--- kernel.log tail ---"
          tail -n 240 "$OUTPUT_DIR/kernel.log" || true

      - name: Assert training trace harvest produced structured results
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.poll.outputs.terminal }}" != "complete" ]]; then
            echo "Kaggle training trace kernel did not complete successfully: ${{ steps.poll.outputs.terminal }}" >&2
            exit 1
          fi
          test -f "$OUTPUT_DIR/verifier_training_trace_results.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output_dir = Path(os.environ["OUTPUT_DIR"])
          result = json.loads(
              (output_dir / "verifier_training_trace_results.json").read_text(encoding="utf-8")
          )
          manifest = json.loads(
              Path("docs/evaluation/verifier-lora-train-subset-v0.json").read_text(encoding="utf-8")
          )
          expected_ids = [item["instance_id"] for item in manifest["tasks"]]
          assert len(expected_ids) == 18, expected_ids
          assert result.get("version") == "verifier-lora-v0-train-harvest", result
          assert result.get("model") == "gemma-4-e4b-it-qat-w4a16-ct", result
          assert result.get("status") == "completed", result
          assert result.get("requested") == len(expected_ids), result
          assert len(result.get("results", [])) == len(expected_ids), result
          assert [item.get("instance_id") for item in result.get("results", [])] == expected_ids, result
          for item in result["results"]:
              assert "agent_patch" not in item, item
          print(json.dumps({k: v for k, v in result.items() if k != "results"}, indent=2, sort_keys=True))
          PY

      - name: Upload training trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-verifier-training-trace-harvest-v0-evidence
          path: /tmp/gemma4-verifier-training-trace-harvest-v0-output
          if-no-files-found: warn
          retention-days: 14
