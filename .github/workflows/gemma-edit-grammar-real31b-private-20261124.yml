name: Gemma edit grammar fresh 31B paired private once
on:
  push:
    branches: [research/gemma-edit-grammar-single-variable-20261124]
    paths: [.github/workflows/gemma-edit-grammar-real31b-private-20261124.yml]
permissions: {contents: read}
concurrency:
  group: gemma-edit-grammar-real31b-once
  cancel-in-progress: false
jobs:
  paired:
    if: "${{ github.event.head_commit.message == 'GO_GEMMA_EDIT_GRAMMAR_FRESH31B_PRIVATE_20261124' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 195
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: kolihhan/gemma4-edit-grammar-paired-20261124-v1
      OLD_REF: kolihhan/gemma4-behavioral-paired-20261123-v1
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Preflight and prior pilot exclusion
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/render_edit_grammar_paired31b_20261124.py
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -q kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from scripts.render_edit_grammar_paired31b_20261124 import validate_manifest
          p=json.loads(Path('experiments/edit-grammar-paired-20261124/manifest.json').read_text())
          validate_manifest(p)
          q=json.loads(subprocess.run(['kaggle','quota','--format','json'],capture_output=True,text=True,check=True,timeout=90).stdout)
          gpu=[x for x in q if x.get('resource')=='GPU']
          if len(gpu)!=1:raise RuntimeError('AMBIGUOUS_GPU_QUOTA')
          remaining=float(str(gpu[0]['remaining']).rstrip('h'))
          print('GPU_REMAINING_HOURS='+str(remaining))
          if remaining<6:raise RuntimeError('GPU_BELOW_6H')
          PY
          if kaggle kernels status "$KERNEL_REF" >/tmp/existing.log 2>&1; then
            echo STOP_EXACT_PRIVATE_KERNEL_EXISTS
            exit 1
          fi
          oldstatus="$(kaggle kernels status "$OLD_REF" 2>&1)"
          [[ "$oldstatus" == *KernelWorkerStatus.COMPLETE* ]] || exit 1
          mkdir -p /tmp/gemma-old /tmp/gemma-source /tmp/gemma-render /tmp/gemma-result
          kaggle kernels output "$OLD_REF" -p /tmp/gemma-old -o >/tmp/old.log 2>&1
          kaggle kernels output lynnsakurai/gemma-4-budget-fit-agent-w-bounded-rescue/2 -p /tmp/gemma-source -o >/tmp/source.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('/tmp/gemma-old/paired_behavioral_probe31b_4min_results.json').read_text())
          assert old['status']=='completed' and len(old['results'])==16
          ids=set(old['selected_public_dev_ids'])
          assert len(ids)==8
          p=Path('experiments/edit-grammar-paired-20261124/manifest.json')
          plan=json.loads(p.read_text())
          previous=set(plan['selection']['exclude_instance_ids'])
          assert not ids.intersection(previous)
          plan['selection']['exclude_instance_ids']=sorted(previous|ids)
          p.write_text(json.dumps(plan,sort_keys=True,indent=2)+'\n')
          print('PREVIOUS_EIGHT_ISSUES_EXCLUDED=TRUE')
          PY
      - name: Exact private kernel render and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.render_edit_grammar_paired31b_20261124 --source-zip /tmp/gemma-source/submission.zip --out /tmp/gemma-render --kernel-ref "$KERNEL_REF"
          python - <<'PY'
          import py_compile,json
          from pathlib import Path
          p=Path('/tmp/gemma-render')
          py_compile.compile(str(p/'paired_edit_grammar31b_5min_runtime.py'),doraise=True)
          m=json.loads((p/'kernel-metadata.json').read_text())
          assert m['is_private'] and m['enable_gpu'] and not m['enable_internet']
          print('REAL_31B_CPU_PREFLIGHT=PASS')
          PY
      - name: Push exactly one private L4 model kernel
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p /tmp/gemma-render --accelerator NvidiaL4 -t 9000 >/tmp/push.log 2>&1 || {
            grep -Ei 'error|failed|invalid|quota' /tmp/push.log | tail -n 8 || true
            exit 1
          }
          echo "PRIVATE_KERNEL_PUSHED=$KERNEL_REF"
          echo "OFFICIAL_SUBMISSION=FALSE"
      - name: Poll existing kernel without relaunch
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          terminal=UNKNOWN
          for attempt in $(seq 1 120); do
            raw="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            case "$raw" in
              *KernelWorkerStatus.COMPLETE*) terminal=COMPLETE; break ;;
              *KernelWorkerStatus.ERROR*|*KernelWorkerStatus.FAILED*|*KernelWorkerStatus.CANCELLED*) terminal=ERROR; break ;;
            esac
            if (( attempt % 8 == 0 )); then echo "PRIVATE_POLL=$attempt"; fi
            sleep 75
          done
          echo "PRIVATE_KERNEL_TERMINAL=$terminal"
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          [[ "$terminal" == COMPLETE ]]
      - name: Safe 16-result grader comparison
        if: steps.poll.outputs.terminal == 'COMPLETE'
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels output "$KERNEL_REF" -p /tmp/gemma-result -o >/tmp/result.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/gemma-result/paired_edit_grammar31b_5min_results.json').read_text())
          rows=d.get('results',[])
          arms=('champion_5min','edit_grammar_5min')
          assert d['status']=='completed' and len(rows)==16
          index={(x['instance_id'],x['arm']):x for x in rows}
          ids={x[0] for x in index}
          assert len(ids)==8 and len(index)==16
          assert set(index)=={(i,a) for i in ids for a in arms}
          old=json.loads(Path('/tmp/gemma-old/paired_behavioral_probe31b_4min_results.json').read_text())
          assert not ids.intersection(old['selected_public_dev_ids'])
          counts={'both':0,'rescue':0,'regression':0,'neither':0}
          for i in ids:
            c=index[(i,arms[0])]['resolved'] is True
            t=index[(i,arms[1])]['resolved'] is True
            counts['both' if c and t else 'regression' if c else 'rescue' if t else 'neither']+=1
          print('REAL_31B_PAIRED_SAFE_RESULT='+json.dumps({
            'paired_issues':8,'evaluations':16,'outcomes':counts,
            'control_resolved':counts['both']+counts['regression'],
            'candidate_resolved':counts['both']+counts['rescue'],
            'tool_calls':{a:sum(x.get('tool_calls') or 0 for x in rows if x['arm']==a) for a in arms},
            'seconds':{a:round(sum(x.get('duration_seconds') or 0 for x in rows if x['arm']==a),2) for a in arms},
            'patches':{a:sum(x.get('has_patch') is True for x in rows if x['arm']==a) for a in arms},
            'errors':{a:sum(x.get('status')!='completed' for x in rows if x['arm']==a) for a in arms},
            'official_submission':False,'gold_noop_certified':False
          },sort_keys=True))
          PY
      - name: Wipe private source, traces and output
        if: always()
        run: rm -rf /tmp/gemma-old /tmp/gemma-source /tmp/gemma-render /tmp/gemma-result /tmp/existing.log /tmp/old.log /tmp/source.log /tmp/push.log /tmp/result.log
