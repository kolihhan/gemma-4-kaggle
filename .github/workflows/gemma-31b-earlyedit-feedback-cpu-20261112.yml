name: Gemma 31B existing trace + fast thinking candidate CPU preflight
on:
  push:
    branches: [research/31b-earlyedit-paired-20261112]
    paths: [.github/workflows/gemma-31b-earlyedit-feedback-cpu-20261112.yml]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Synthetic paired trace regressions, fail closed on lost tasks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -q tests.test_audit_earlyedit_existing_traces tests.test_build_gemma_fastthink_5min60_v1 tests.test_build_toolcap60_timeout_recovery
          python -m py_compile scripts/audit_earlyedit_existing_traces.py scripts/build_gemma_fastthink_5min60_v1.py
          echo GEMMA_FASTTHINK_ONE_VARIABLE_CPU_VALIDATION=PASS
          echo NO_KAGGLE_AUTH_INFERENCE_GPU_OR_SUBMISSION=TRUE
