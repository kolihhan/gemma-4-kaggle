name: Official Recovery Reviewer v0 Kaggle submission

on:
  push:
    branches: [research/dual-agent-recovery-v0-20261108]
    paths: [".github/workflows/submit-recovery-reviewer-v0.yml"]

permissions:
  contents: read

concurrency:
  group: gemma4-recovery-reviewer-v0-official-once
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle client and run independent CPU builder tests
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0" "nbformat==5.10.4"
          python -m unittest -v tests.test_recovery_decision_builder tests.test_prepare_public_budgetfit_v2
      - name: Authenticate and confirm one available submission slot
        run: |
          set -euo pipefail
          python -m scripts.submit_recovery_official_once quota
      - name: Install official competition compiler packages for CPU validation
        run: |
          set -euo pipefail
          mkdir -p /tmp/gemma4-official-wheels
          for wheel in adk_submission-0.2.13-py3-none-any.whl google_adk-1.36.1-py3-none-any.whl adk_eval_core-0.1.0-py3-none-any.whl; do
            kaggle datasets download -d metric/gemma-4-developer-agent-wheelhouse -f "$wheel" -p /tmp/gemma4-official-wheels --unzip >/dev/null
          done
          python -m pip install -q --disable-pip-version-check /tmp/gemma4-official-wheels/*.whl
          python - <<'PY'
          import importlib.metadata
          for name, expected in (("adk-submission", "0.2.13"), ("google-adk", "1.36.1"), ("adk-eval-core", "0.1.0")):
              actual = importlib.metadata.version(name)
              assert actual == expected, (name, actual)
              print("OFFICIAL_COMPILER_VERSION", name, actual)
          PY
      - name: Build both matched 31B packages; validate and compile without inference
        run: |
          set -euo pipefail
          python -m scripts.submit_recovery_official_once preflight
      - name: Publish private CPU notebook and submit officially once
        run: |
          set -euo pipefail
          python -m scripts.submit_recovery_official_once submit
