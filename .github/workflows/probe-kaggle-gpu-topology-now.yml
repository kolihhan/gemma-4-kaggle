name: Probe Kaggle GPU topology once

on:
  push:
    branches: [exp/verifier-lora-v0]
    paths:
      - .github/workflows/probe-kaggle-gpu-topology-now.yml

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KERNEL_DIR: /tmp/kaggle-gpu-topology-probe
  OUTPUT_DIR: /tmp/kaggle-gpu-topology-probe-output
  KERNEL_REF: kolihhan/gemma4-gpu-topology-probe-${{ github.run_id }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render GPU topology probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$KERNEL_DIR" "$OUTPUT_DIR"
          mkdir -p "$KERNEL_DIR" "$OUTPUT_DIR"
          cat > "$KERNEL_DIR/probe.py" <<'PY'
          import json
          import torch

          devices = []
          for i in range(torch.cuda.device_count()):
              props = torch.cuda.get_device_properties(i)
              devices.append({
                  "index": i,
                  "name": props.name,
                  "total_memory_gib": round(props.total_memory / (1024**3), 3),
                  "major": props.major,
                  "minor": props.minor,
              })
          result = {
              "cuda_available": torch.cuda.is_available(),
              "device_count": torch.cuda.device_count(),
              "devices": devices,
          }
          print("GPU_TOPOLOGY", json.dumps(result, sort_keys=True))
          assert result["cuda_available"]
          assert result["device_count"] >= 1
          PY
          cat > "$KERNEL_DIR/kernel-metadata.json" <<EOF
          {
            "id": "${KERNEL_REF}",
            "title": "gemma4-gpu-topology-probe-${GITHUB_RUN_ID}",
            "code_file": "probe.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": false,
            "machine_shape": "NvidiaL4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0'

      - name: Push private GPU topology probe
        run: kaggle kernels push -p "$KERNEL_DIR" -t 600

      - name: Poll probe
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          terminal=""
          for attempt in $(seq 1 30); do
            status="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "[$attempt] $status"
            lower="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
            if grep -Eq 'complete|completed' <<<"$lower"; then terminal="complete"; break; fi
            if grep -Eq 'error|failed|failure|cancelled|canceled' <<<"$lower"; then terminal="error"; break; fi
            sleep 10
          done
          [[ -n "$terminal" ]] || terminal="timeout"
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          test "$terminal" = "complete"

      - name: Collect logs
        if: always()
        shell: bash
        run: |
          set +e
          kaggle kernels logs "$KERNEL_REF" > "$OUTPUT_DIR/kernel.log" 2>&1
          cat "$OUTPUT_DIR/kernel.log" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-topology-probe-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 7
