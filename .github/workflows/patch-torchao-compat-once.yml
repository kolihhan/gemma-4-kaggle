name: Patch torchao compatibility once

on:
  push:
    branches: [exp/verifier-lora-v0]
    paths:
      - .github/workflows/patch-torchao-compat-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/verifier-lora-v0

      - name: Apply minimal old-torchao compatibility guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("kaggle/train_verifier_lora.py")
          source = path.read_text(encoding="utf-8")

          anchor = "\n\ndef _walk_forbidden(value: Any, path: str = \"$\") -> None:\n"
          helper = r'''


def ensure_peft_torchao_compat(*, version_lookup=None, runner=None) -> dict[str, str]:
    """Remove only a known-incompatible torchao before importing PEFT.

    Kaggle currently ships torchao 0.10.0 while PEFT 0.20 requires >=0.16
    whenever torchao is present. The E4B checkpoint used here is the explicit
    unquantized variant, so old torchao is not part of this training contract.
    """
    import importlib.metadata
    import subprocess
    import sys

    if version_lookup is None:
        version_lookup = importlib.metadata.version
    if runner is None:
        runner = subprocess.run

    try:
        version = str(version_lookup("torchao"))
    except importlib.metadata.PackageNotFoundError:
        return {"torchao_version": "missing", "action": "none"}

    pieces = version.split(".")
    if len(pieces) < 2:
        raise RuntimeError(f"cannot parse installed torchao version: {version!r}")
    try:
        major = int(pieces[0])
        minor = int(pieces[1])
    except ValueError as exc:
        raise RuntimeError(f"cannot parse installed torchao version: {version!r}") from exc

    if (major, minor) >= (0, 16):
        return {"torchao_version": version, "action": "none"}

    runner(
        [sys.executable, "-m", "pip", "uninstall", "-y", "torchao"],
        check=True,
        text=True,
        capture_output=True,
    )
    return {"torchao_version": version, "action": "uninstalled_incompatible"}
'''
          if source.count(anchor) != 1:
              raise SystemExit(f"unexpected helper insertion anchor count: {source.count(anchor)}")
          source = source.replace(anchor, helper + anchor, 1)

          old_main = '''def main() -> None:\n    import torch\n    from datasets import Dataset\n    from peft import LoraConfig, get_peft_model\n    from transformers import (\n'''
          new_main = '''def main() -> None:\n    ensure_peft_torchao_compat()\n\n    import torch\n    from datasets import Dataset\n    from transformers import (\n'''
          if source.count(old_main) != 1:
              raise SystemExit(f"unexpected main import block count: {source.count(old_main)}")
          source = source.replace(old_main, new_main, 1)

          transformer_close = '''        set_seed,\n    )\n\n    if not MODEL_PATH.is_dir():\n'''
          transformer_with_peft = '''        set_seed,\n    )\n    from peft import LoraConfig, get_peft_model\n\n    if not MODEL_PATH.is_dir():\n'''
          if source.count(transformer_close) != 1:
              raise SystemExit(f"unexpected transformers import close count: {source.count(transformer_close)}")
          source = source.replace(transformer_close, transformer_with_peft, 1)

          path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          git diff -- kaggle/train_verifier_lora.py

      - name: Commit exact trainer fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaggle/train_verifier_lora.py
          git commit -m "fix: remove incompatible torchao before PEFT"
          git push origin HEAD:exp/verifier-lora-v0
