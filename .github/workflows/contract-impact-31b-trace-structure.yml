name: Read private 31B trace structure without raw content

on:
  push:
    branches: [research/dual-agent-recovery-v0-20261108]
    paths: [".github/workflows/contract-impact-31b-trace-structure.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: kolihhan/gemma4-contractpair-31b-42576094444
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download existing private kernel output
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0"
          mkdir -p /tmp/gemma4-private-traces
          kaggle kernels output "$KERNEL_REF" -p /tmp/gemma4-private-traces -o >/dev/null
      - name: Describe trace schema only (never print record values)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,collections,hashlib
          from pathlib import Path
          root=Path('/tmp/gemma4-private-traces')
          files=[x for x in root.rglob('*') if x.is_file()]
          print('TRACE_STRUCTURE_FILE_COUNT='+str(len(files)))
          for i,path in enumerate(sorted(files)):
              relative=path.relative_to(root).as_posix()
              arm='baseline_v2' if 'baseline_v2' in relative else (
                  'contract_impact' if 'contract_impact' in relative else 'other')
              if relative.endswith('contract_impact_paired_31b_results.json'):
                  continue
              name=hashlib.sha256(relative.encode()).hexdigest()[:10]
              info={'file_index':i,'path_hash':name,'arm':arm,'suffix':path.suffix,'bytes':path.stat().st_size}
              if path.suffix in {'.json','.jsonl'}:
                  try:
                      if path.suffix=='.json':
                          data=json.loads(path.read_text(errors='replace'))
                      else:
                          data=[json.loads(x) for x in path.read_text(errors='replace').splitlines()[:15] if x.strip()]
                      info['top_type']=type(data).__name__
                      if isinstance(data,dict):
                          info['top_keys']=sorted(str(k)[:60] for k in data)[:80]
                          for key,val in data.items():
                              if isinstance(val,list):
                                  info['list_'+str(key)[:32]+'_size']=len(val)
                                  if val and isinstance(val[0],dict):
                                      info['list_'+str(key)[:32]+'_first_keys']=sorted(val[0])[:50]
                      elif isinstance(data,list):
                          info['count']=len(data)
                          if data and isinstance(data[0],dict):
                              info['first_keys']=sorted(data[0])[:50]
                  except Exception as e:
                      info['parse_error_type']=type(e).__name__
              print('TRACE_SCHEMA='+json.dumps(info,sort_keys=True))
          # Inspect structure of the actual evaluator steps, not their contents.
          for arm in ('baseline_v2','contract_impact'):
              traces=[p for p in files if p.suffix=='.json'
                      and arm in p.relative_to(root).as_posix()
                      and p.name!='contract_impact_paired_31b_results.json']
              print('TRACE_ARM_TRACE_COUNT='+arm+':'+str(len(traces)))
              for p in traces[:2]:
                  obj=json.loads(p.read_text())
                  final=obj.get('final_metrics',{})
                  print('TRACE_FINAL_METRIC_KEYS='+arm+':'+json.dumps(
                      sorted(final) if isinstance(final,dict) else ['not_dict']))
                  events=obj.get('steps',[])
                  shapes=collections.Counter()
                  by_source=collections.Counter()
                  nested=collections.Counter()
                  for item in events:
                      source=item.get('source')
                      by_source[str(source) if str(source) in
                                {'agent','tool','user','assistant','model','system','function'} else 'other']+=1
                      for tag in ('extra','message'):
                          val=item.get(tag)
                          shapes[(tag,type(val).__name__)]+=1
                          if isinstance(val,dict):
                              nested[(tag,tuple(sorted(val.keys())))]+=1
                          elif isinstance(val,list) and val and isinstance(val[0],dict):
                              nested[(tag,tuple(sorted(val[0].keys())))]+=1
                  print('TRACE_STEP_SHAPES='+arm+':'+json.dumps({
                      str(k):v for k,v in shapes.items()},sort_keys=True))
                  print('TRACE_STEP_SOURCE_COUNTS='+arm+':'+json.dumps(
                      dict(by_source),sort_keys=True))
                  print('TRACE_STEP_DICT_KEY_PATTERNS='+arm+':'+json.dumps({
                      str(k):v for k,v in nested.items()},sort_keys=True)[:8000])
          # Count actual event types and approved tool-token appearances by arm.
          allowed_tools=(
              'read_file','edit_file','write_file','run_command','submit_patch',
              'get_status','get_code_neighbors','search_similar_code',
              'get_code_subgraph','load_skill','run_skill_script','agent_tool')
          for arm in ('baseline_v2','contract_impact'):
              traces=[p for p in files if p.suffix=='.json'
                      and arm in p.relative_to(root).as_posix()
                      and p.name!='contract_impact_paired_31b_results.json']
              types=collections.Counter()
              authors=collections.Counter()
              mentions=collections.Counter()
              json_messages=0
              tokens=collections.Counter()
              for p in traces:
                  obj=json.loads(p.read_text())
                  final=obj.get('final_metrics',{})
                  for k in ('total_prompt_tokens','total_completion_tokens','total_cached_tokens'):
                      v=final.get(k,0)
                      if isinstance(v,(int,float)):
                          tokens[k]+=v
                  for step in obj.get('steps',[]):
                      extra=step.get('extra') or {}
                      typ=str(extra.get('event_type','other'))
                      types[typ if typ in {'text','tool_call','tool_response','model','message',
                                           'function_call','function_response','agent',
                                           'llm_response','agent_response','event','tool',
                                           'tool_result','unknown'} else 'other']+=1
                      author=str(extra.get('author','other'))
                      authors[author if author in {'agent','user','system','tool','model',
                                                  'assistant','swe_coder'} else 'other']+=1
                      message=step.get('message')
                      if not isinstance(message,str):continue
                      try:
                          json.loads(message)
                          json_messages+=1
                      except (TypeError,ValueError):
                          pass
                      for name in allowed_tools:
                          import re
                          if re.search(r'(?<![a-zA-Z0-9_])'+re.escape(name)+r'(?![a-zA-Z0-9_])',message):
                              mentions[name]+=1
              print('TRACE_TOOL_UPTAKE_EVIDENCE='+json.dumps({
                  'arm':arm,'events':dict(types),'authors':dict(authors),
                  'known_tool_name_mention_steps':dict(mentions),
                  'json_parsable_step_messages':json_messages,
                  'model_token_totals':dict(tokens),
                  'caveat':'tool name mention is not verified invocation',
              },sort_keys=True))
          print('NO_RAW_TRACE_CONTENT_PRINTED=TRUE')
          print('NO_NEW_INFERENCE_OR_COMPETITION_SUBMISSION=TRUE')
          PY
