name: Discriminating Evidence v0 CPU-only preflight

on:
  push:
    branches: [research/discriminating-evidence-v0]
    paths:
      - "scripts/discriminating_evidence_preflight.py"
      - "scripts/discriminating_evidence_exploratory.py"
      - "scripts/discriminating_evidence_history_audit.py"
      - "scripts/discriminating_evidence_schema.py"
      - "tests/test_discriminating_evidence_preflight.py"
      - "tests/test_discriminating_evidence_exploratory.py"
      - "tests/test_discriminating_evidence_schema.py"
      - ".github/workflows/discriminating-evidence-preflight.yml"
      - "docs/research/discriminating-evidence-v0-gate-2026-11-05.md"
      - "docs/research/discriminating-evidence-v0-exploratory-4plus12-2026-11-06.md"
      - "docs/evaluation/discriminating-evidence-v0-exploratory-selection-2026-11-06.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test metadata-only gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/discriminating_evidence_preflight.py tests/test_discriminating_evidence_preflight.py
          python -m unittest -v tests.test_discriminating_evidence_preflight tests.test_discriminating_evidence_exploratory tests.test_discriminating_evidence_schema
      - name: Confirm known NO-GO without tasks, models or Kaggle
        run: |
          set -euo pipefail
          python scripts/discriminating_evidence_preflight.py \
            --repo . --out /tmp/discriminating-evidence-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("/tmp/discriminating-evidence-preflight.json").read_text())
          assert r["status"] == "NO_GO_INADEQUATE_REPLACEMENT_BUFFER"
          assert r["candidate_counts"] == {"Textualize/rich": 14, "fastapi/fastapi": 16}
          assert r["replacement_counts"] == {"Textualize/rich": 0, "fastapi/fastapi": 2}
          assert len(r["pilot_ids"]) == 4 and len(r["confirmation_ids"]) == 24
          assert not r["certifies_blind"]
          assert not r["gold_noop_eligible"]
          assert not r["GPU_or_Kaggle_submission_authorized"]
          print("DISCRIMINATING_EVIDENCE_PREFLIGHT=EXPECTED_NO_GO")
          print("NO_KAGGLE_NO_GPU_NO_TRAINING_NO_SUBMISSION=PASS")
          PY
      - name: Freeze proposed 4 plus 12 metadata-only selection
        run: |
          set -euo pipefail
          python -m scripts.discriminating_evidence_exploratory \
            --repo . --out /tmp/discriminating-evidence-exploratory.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("/tmp/discriminating-evidence-exploratory.json").read_text())
          assert r["status"] == "NO_GO_HISTORY_AND_ELIGIBILITY_UNCHECKED", r["status"]
          assert len(r["pilot_ids"]) == 4 and len(r["exploratory_ids"]) == 12
          assert r["replacement_counts"] == {"Textualize/rich": 6, "fastapi/fastapi": 8}
          assert not r["certifies_blind"] and not r["gpu_or_submission_authorized"]
          print("EXPLORATORY_COHORT_FROZEN_METADATA=", json.dumps({
            "version": r["version"],
            "pilot_ids": r["pilot_ids"],
            "exploratory_ids": r["exploratory_ids"],
            "replacement_ids": r["replacement_ids"],
            "candidate_counts": r["candidate_counts"],
            "replacement_counts": r["replacement_counts"],
            "parent_selection_fingerprint_sha256": r["parent_selection_fingerprint_sha256"],
            "selection_digest_sha256": r["selection_digest_sha256"],
            "status": r["status"],
          }, sort_keys=True))
          PY
      - name: Audit preselection tracked Git history without task data
        run: |
          set -euo pipefail
          python -m scripts.discriminating_evidence_history_audit \
            --repo . --out /tmp/discriminating-evidence-history-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("/tmp/discriminating-evidence-history-audit.json").read_text())
          assert a["candidate_count"] == 30
          assert a["cutoff_utc"] == "2026-11-05T15:59:38Z"
          assert not a["certifies_blind"]
          print("HISTORY_SOURCE_AUDIT=", json.dumps({
              "status": a["status"],
              "historical_exposed_ids": a["historical_exposed_ids"],
              "checked_revisions": a["checked_revisions"],
              "checked_branch_refs": a["checked_branch_refs"],
          }, sort_keys=True))
          print("NOT_FULL_BLIND_CERTIFICATION=TRUE")
          PY
