name: Probe topology single-root progress once

on:
  push:
    branches: [exp/topology-ab]
    paths:
      - ".github/workflows/probe-topology-single-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: kolihhan/gemma4-topology-single-41458804862
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query structured progress only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q "kaggle==2.2.5" "six==1.17.0"
          kaggle kernels status "$KERNEL_REF" || true
          kaggle kernels logs "$KERNEL_REF" 2>/dev/null \
            | grep -E '^BASELINE_RESULT|^BASELINE_SUMMARY|\[[0-9]{2}/17\] baseline' \
            | tail -n 80 || true
