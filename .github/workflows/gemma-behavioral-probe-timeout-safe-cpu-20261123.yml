name: Gemma behavioral probe matched 4min CPU integrity only
on:
  push:
    branches: [exp/gemma-behavioral-verify-timeout-safe-20261123]
    paths:
      - .github/workflows/gemma-behavioral-probe-timeout-safe-cpu-20261123.yml
      - scripts/build_behavioral_probe_timeout_safe_20261123.py
      - tests/test_build_behavioral_probe_timeout_safe_20261123.py
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: CPU-only unit tests and compile
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_behavioral_probe_timeout_safe_20261123.py
          python -m unittest -v tests.test_build_behavioral_probe_timeout_safe_20261123
          echo BEHAVIORAL_TIMEOUT_SAFE_CPU_UNIT_TESTS=PASS
      - name: Verify exact 0.18 Champion lineage from immutable source - no model inference
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { test -n "$KAGGLE_USERNAME" && test -n "$KAGGLE_KEY"; }
          python -m pip install -q kaggle==2.2.5 six==1.17.0
          mkdir -p /tmp/gemma-behavioral/source
          kaggle kernels output lynnsakurai/gemma-4-budget-fit-agent-w-bounded-rescue/2 \
            -p /tmp/gemma-behavioral/source -o >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_behavioral_probe_timeout_safe_20261123 import (
              describe, timeout_forecast, build_pair
          )
          files=list(Path('/tmp/gemma-behavioral/source').rglob('submission.zip'))
          if len(files)!=1: raise RuntimeError('PINNED_SOURCE_ZIP_NOT_UNIQUE')
          source=files[0].read_bytes()
          control,candidate=build_pair(source)
          d=describe(source)
          assert control!=candidate
          assert d['per_task_minutes']==4 and d['max_tool_calls']==60
          assert d['only_difference_between_arms']=='prompts/system.md'
          assert timeout_forecast(tasks=120,mean_setup_seconds=45)['safe_under_assumptions']
          assert not timeout_forecast(tasks=140,mean_setup_seconds=45)['safe_under_assumptions']
          print('EXACT_CHAMPION_LINEAGE=PASS')
          print('FOUR_MINUTE_MATCHED_CANDIDATE=PASS')
          print('CANDIDATE_METADATA='+json.dumps(d,sort_keys=True))
          print('NO_GPU=TRUE;NO_MODEL_INFERENCE=TRUE;NO_OFFICIAL_SUBMISSION=TRUE')
          PY
      - name: Remove transient bundles
        if: always()
        run: rm -rf /tmp/gemma-behavioral
