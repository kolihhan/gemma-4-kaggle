name: Gemma rank2 exact scored version and practice mechanism comparison
on:
  push:
    branches: [research/single-edit-channel-20261124]
    paths: [.github/workflows/gemma-rank2-exact-score-20261124.yml]
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Analyze published aggregate and version-level outcomes without running models
        shell: bash
        run: |
          set -euo pipefail
          pip install -q kaggle==2.2.5 six==1.17.0 pyyaml
          mkdir -p /tmp/rank2
          kaggle datasets download -d muhammedidris28/gemma4-agent-runs -p /tmp/rank2 --unzip >/dev/null
          python - <<'PY'
          import json,hashlib,statistics,collections,difflib,yaml
          from pathlib import Path
          p=Path('/tmp/rank2')
          lb=json.loads((p/'leaderboard.json').read_text())
          print('RANK2_PUBLISHED_LB='+json.dumps(lb,sort_keys=True),flush=True)
          rows=[json.loads(l) for l in (p/'runs.jsonl').read_text().splitlines() if l.strip()]
          print('RANK2_ROWS='+str(len(rows)),flush=True)
          groups=collections.defaultdict(list)
          for r in rows: groups[(str(r.get('agent')),str(r.get('set')),str(r.get('run')))].append(r)
          for (a,s,run),rs in sorted(groups.items()):
              def med(k): 
                  v=[r[k] for r in rs if isinstance(r.get(k),(int,float)) and not isinstance(r[k],bool)]
                  return round(statistics.median(v),2) if v else None
              kinds=collections.Counter()
              for r in rs:
                  if isinstance(r.get('calls_by_kind'),dict): kinds.update({k:v for k,v in r['calls_by_kind'].items() if isinstance(v,int)})
              print('RANK2_PRACTICE='+json.dumps(dict(agent=a,set=s,run=run,n=len(rs),resolved=sum(r.get('resolved') is True for r in rs),empty=sum(r.get('empty_patch') is True for r in rs),median_seconds=med('seconds'),median_first_edit_seconds=med('first_edit_s'),median_calls=med('tool_calls'),median_compactions=med('compactions'),kinds=dict(kinds)),sort_keys=True),flush=True)
          def digest(f):return hashlib.sha256(f.read_bytes()).hexdigest()
          for a in sorted((p/'agents').iterdir()):
              if not a.is_dir():continue
              files={str(f.relative_to(a)):digest(f) for f in a.rglob('*') if f.is_file()}
              prompt=a/'prompts/system.md'
              # Metadata and key short descriptions only; no verbatim public prompt dump.
              config={}
              for f in [a/'agent.yaml',a/'eval_config.yaml',a/'configs/sampling.yaml']:
                  if f.exists():
                      # Handle !include without interpreting or executing it.
                      text=f.read_text()
                      if f.name=='agent.yaml':
                          config['model']=next((l.split(':',1)[1].strip() for l in text.splitlines() if l.startswith('model:')),None)
                          config['adapter']=next((l.split(':',1)[1].strip() for l in text.splitlines() if l.startswith('adapter:')),None)
                          config['tools']=[l.strip()[2:] for l in text.splitlines() if l.startswith('  - ') and ':' not in l.strip()[2:]]
                      else:config[f.name]=yaml.safe_load(text)
              headings=[l.strip() for l in prompt.read_text().splitlines() if l.startswith('#')] if prompt.exists() else []
              print('RANK2_VERSION='+json.dumps(dict(version=a.name,files=files,config=config,prompt_headings=headings),sort_keys=True),flush=True)
          # Focus on later untrained versions; report semantic additions as
          # original paraphrase categories via keyword presence, not copying prose.
          versions=['v19','v24','v25','v30','v31','v32','v35','v37']
          for v in versions:
              f=p/'agents'/v/'prompts/system.md'
              if not f.exists():continue
              t=f.read_text().lower()
              terms=['reproduc','test','git grep','timeout','early','submit_patch','contract','first edit','docstring','caller','signature','context','search','test-context','assert','scratch','exact','diff']
              print('RANK2_PROMPT_FEATURES='+json.dumps(dict(version=v,characters=len(t),terms={k:t.count(k) for k in terms}),sort_keys=True),flush=True)
          PY
      - name: Remove local downloaded materials
        if: always()
        run: rm -rf /tmp/rank2
