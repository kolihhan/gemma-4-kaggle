name: Gemma 31B Source-first Locator CPU Gate One Shot
on:
  push:
    branches: [research/dual-agent-recovery-v0-20261108]
    paths:
      - .github/workflows/gemma-source-first-locator-v1-cpu.yml
permissions: {contents: read}
concurrency:
  group: gemma-source-first-locator-cpu-20261118
  cancel-in-progress: false
jobs:
  policy_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/build_source_first_localization_v1.py
            /scripts/submit_source_first_localization_v1_once.py
            /scripts/submit_existing_test_retrieval_official_once_20261117.py
            /scripts/submit_v2_toolcap60_official_once.py
            /scripts/build_toolcap60_timeout_recovery.py
            /scripts/build_v2_toolcap_submission.py
            /scripts/prepare_public_budgetfit_v2.py
            /tests/test_build_source_first_localization_v1.py
            /scripts/gemma31_uploaded_coder_adapter_one_variable_cpu.py
            /tests/test_gemma31_uploaded_coder_adapter_one_variable_cpu.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Five local fixed-model contract tests and syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_source_first_localization_v1.py scripts/submit_source_first_localization_v1_once.py scripts/gemma31_uploaded_coder_adapter_one_variable_cpu.py
          python -m unittest discover -s tests -p test_build_source_first_localization_v1.py -v
          python -m unittest discover -s tests -p test_gemma31_uploaded_coder_adapter_one_variable_cpu.py -v
      - name: Pin original scored 31B source, enforce 0.18 budget and test one-variable real archive
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          mkdir -p /tmp/gemma-source-first-original
          kaggle kernels output lynnsakurai/gemma-4-budget-fit-agent-w-bounded-rescue/2 -p /tmp/gemma-source-first-original -o >/dev/null
          python - <<'PY'
          import hashlib,io,json,zipfile
          from pathlib import Path
          from scripts.prepare_public_budgetfit_v2 import validate_source_zip
          from scripts.build_toolcap60_timeout_recovery import build as control_build
          from scripts.build_source_first_localization_v1 import build as treatment_build,summary
          from scripts.gemma31_uploaded_coder_adapter_one_variable_cpu import control as verify_lora_scored_base
          raw=(Path('/tmp/gemma-source-first-original')/'submission.zip').read_bytes()
          validate_source_zip(raw)
          baseline=control_build(raw)
          ctrl_sha=hashlib.sha256(baseline).hexdigest()
          assert ctrl_sha=='ff08c10240a38e151a2ea1d0478e999ee5d2f437d2dad5571d912cf12859922b',ctrl_sha
          assert len(verify_lora_scored_base(baseline))==4
          print('GEMMA_31B_LORA_ONE_VARIABLE_CONTROL_VERIFIED=TRUE',flush=True)
          treatment=treatment_build(raw)
          with zipfile.ZipFile(io.BytesIO(baseline)) as a,zipfile.ZipFile(io.BytesIO(treatment)) as b:
              assert a.namelist()==b.namelist()
              assert [k for k in a.namelist() if a.read(k)!=b.read(k)]==['prompts/system.md']
          print('GEMMA_SOURCE_FIRST_PINNED_018_CONTROL_SHA='+ctrl_sha,flush=True)
          print('GEMMA_SOURCE_FIRST_REAL_ARCHIVE_CONTRACT='+json.dumps(summary(raw),sort_keys=True),flush=True)
          print('GEMMA_SOURCE_FIRST_OFFICIAL_SUBMISSION=FALSE',flush=True)
          print('GEMMA_SOURCE_FIRST_GPU_INFERENCE=FALSE',flush=True)
          # Try the user-supplied Notebook's genuine upstream adapter source.
          # This is authenticated read-only CPU handling; no license assertion,
          # no public upload, no submission, and no hidden task material.
          import subprocess, tempfile
          from scripts.gemma31_uploaded_coder_adapter_one_variable_cpu import package as add_adapter
          with tempfile.TemporaryDirectory(prefix='gemma-owner-adapter-access-') as d:
              source='ayush04barai/lora-step-2'
              try:
                  fetch=subprocess.run(
                      ['kaggle','kernels','output',source,'-p',d,'-o'],
                      capture_output=True,text=True,timeout=180)
              except subprocess.TimeoutExpired:
                  print('GEMMA_EXTERNAL_ADAPTER_STATUS=UNAVAILABLE_TIMEOUT_NO_RETRY',flush=True)
              else:
                  if fetch.returncode:
                      print('GEMMA_EXTERNAL_ADAPTER_STATUS=NOT_ACCESSIBLE_OR_NOT_PUBLISHED',flush=True)
                  else:
                      from pathlib import Path
                      candidates=list(Path(d).rglob('main_lora/adapter_model.safetensors'))
                      candidates=[p for p in candidates if p.with_name('adapter_config.json').is_file()]
                      if len(candidates)!=1:
                          print('GEMMA_EXTERNAL_ADAPTER_STATUS=NO_UNIQUE_REAL_MAIN_LORA_PAIR count='+str(len(candidates)),flush=True)
                      else:
                          try:
                              archive, meta = add_adapter(baseline,candidates[0].parent)
                          except (ValueError,FileNotFoundError,RuntimeError,KeyError,TypeError) as e:
                              print('GEMMA_EXTERNAL_ADAPTER_STATUS=STRICT_CPU_CHECK_REJECTED type='+type(e).__name__,flush=True)
                          else:
                              print('GEMMA_EXTERNAL_ADAPTER_STATUS=STRICT_MATCHED_ZIP_BUILT_IN_TEMP',flush=True)
                              print('GEMMA_EXTERNAL_ADAPTER_SHA256='+meta['weights_sha256'],flush=True)
                              print('GEMMA_MATCHED_CPU_CANDIDATE_SHA256='+meta['candidate_zip_sha256'],flush=True)
                              print('GEMMA_MATCHED_CPU_CANDIDATE_BYTES='+str(len(archive)),flush=True)
                              print('GEMMA_ADAPTER_LICENSE_AND_AGENT_UPTAKE_UNVERIFIED=TRUE',flush=True)
          print('GEMMA_EXTERNAL_ADAPTER_NO_GPU_NO_SUBMISSION_NO_PUBLIC_WEIGHTS=TRUE',flush=True)
          PY
          rm -rf /tmp/gemma-source-first-original

      - name: Official CPU ADK compile real recovered 31B LoRA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gemma-31b-real-adapter-wheelhouse
          for wheel in adk_submission-0.2.13-py3-none-any.whl google_adk-1.36.1-py3-none-any.whl adk_eval_core-0.1.0-py3-none-any.whl swegemma-0.2.11-py3-none-any.whl; do
            kaggle datasets download -d metric/gemma-4-developer-agent-wheelhouse -f "$wheel" -p /tmp/gemma-31b-real-adapter-wheelhouse --unzip >/dev/null
          done
          python -m pip install -q --disable-pip-version-check /tmp/gemma-31b-real-adapter-wheelhouse/*.whl
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess,tempfile
          from scripts.prepare_public_budgetfit_v2 import validate_source_zip
          from scripts.build_toolcap60_timeout_recovery import build as build_control
          from scripts.gemma31_uploaded_coder_adapter_one_variable_cpu import package,compile_adapter_without_inference
          with tempfile.TemporaryDirectory(prefix='gemma-31b-lora-compiled-') as d:
              a=Path(d)/'control'; b=Path(d)/'adapter'
              a.mkdir();b.mkdir()
              subprocess.run(['kaggle','kernels','output',
                  'lynnsakurai/gemma-4-budget-fit-agent-w-bounded-rescue/2',
                  '-p',str(a),'-o'],check=True,stdout=subprocess.DEVNULL,timeout=180)
              subprocess.run(['kaggle','kernels','output',
                  'ayush04barai/lora-step-2',
                  '-p',str(b),'-o'],check=True,stdout=subprocess.DEVNULL,timeout=180)
              source=(a/'submission.zip').read_bytes()
              validate_source_zip(source)
              scored=build_control(source)
              match=[p for p in b.rglob('main_lora/adapter_model.safetensors')
                     if p.with_name('adapter_config.json').is_file()]
              if len(match)!=1:
                  raise RuntimeError('NO_UNIQUE_REAL_ADAPTER_FOR_COMPILER')
              treatment,meta=package(scored,match[0].parent)
              compile_adapter_without_inference(treatment)
              print('GEMMA_REAL_LORA_OFFICIAL_CPU_COMPILE=PASS',flush=True)
              print('GEMMA_REAL_LORA_PINNED_ZIP_SHA='+meta['candidate_zip_sha256'],flush=True)
              print('GEMMA_REAL_LORA_EXPECTED_PILOT=UNMEASURED',flush=True)
          print('GEMMA_REAL_LORA_GPU_SCORING_SUBMISSION_AND_PUBLIC_ARTIFACT=NONE',flush=True)
          PY
          rm -rf /tmp/gemma-31b-real-adapter-wheelhouse
