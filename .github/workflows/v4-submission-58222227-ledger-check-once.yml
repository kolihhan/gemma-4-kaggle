name: Kaggle V4 58222227 normalized official ledger check
on:
  push:
    branches:
      - research/dual-agent-recovery-v0-20261108
    paths:
      - .github/workflows/v4-submission-58222227-ledger-check-once.yml
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use Kaggle CLI verbose CSV normalized status, score, and ID
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0"
          python - <<'PY'
          import csv,io,json,subprocess
          cmd=["kaggle","competitions","submissions","gemma-4-developer-agent","-v"]
          result=subprocess.run(cmd,capture_output=True,text=True,check=True,timeout=120)
          rows=list(csv.DictReader(io.StringIO(result.stdout.lstrip("\ufeff"))))
          hits=[r for r in rows if (r.get("ref") or "").strip()=="58222227"]
          if len(hits)!=1:
              raise RuntimeError("AUTHENTICATED_V4_REF_NOT_UNIQUE")
          x=hits[0]
          if x.get("description")!="solver-v4-cgr-one-shot-20261110":
              raise RuntimeError("AUTHENTICATED_V4_DESCRIPTION_MISMATCH")
          entry={k:x.get(k,"") for k in ("ref","description","status","publicScore","privateScore","date")}
          print("V4_58222227_OFFICIAL_NORMALIZED_LEDGER="+json.dumps(entry,sort_keys=True),flush=True)
          print("V4_58222227_READ_ONLY_NO_GPU_NO_SUBMISSION=TRUE",flush=True)
          PY
