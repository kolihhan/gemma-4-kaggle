name: Gemma reconstruct exact 0.18 champion from pinned public source CPU only
on:
  push:
    branches: [research/dual-agent-recovery-v0-20261108]
    paths:
      - .github/workflows/gemma-recover-champion-0p18-cpu-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dual-agent-recovery-v0-20261108
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kaggle CLI and compile pinned source builders
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0'
          python -m py_compile scripts/prepare_public_budgetfit_v2.py scripts/build_v2_toolcap_submission.py scripts/build_toolcap60_timeout_recovery.py
      - name: Download original public Notebook ZIP and reproduce champion SHA (NO SUBMIT)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_API_TOKEN:-}" && ( -z "${KAGGLE_USERNAME:-}" || -z "${KAGGLE_KEY:-}" ) ]]; then
            echo 'BLOCKED_AUTH_NO_KAGGLE_TOKEN'
            exit 1
          fi
          mkdir -p /tmp/gemma-original-source
          # Public Notebook output at immutable version 2; do not execute untrusted Notebook code.
          kaggle kernels output lynnsakurai/gemma-4-budget-fit-agent-w-bounded-rescue/2 -p /tmp/gemma-original-source -o >/dev/null
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from scripts.prepare_public_budgetfit_v2 import validate_source_zip,EXPECTED_ZIP_SHA256
          from scripts.build_toolcap60_timeout_recovery import build
          expected='ff08c10240a38e151a2ea1d0478e999ee5d2f437d2dad5571d912cf12859922b'
          files=list(Path('/tmp/gemma-original-source').rglob('submission.zip'))
          if len(files)!=1:
              print('CHAMPION_SOURCE_ARCHIVE_COUNT='+str(len(files)))
              raise RuntimeError('ORIGINAL_PUBLIC_ZIP_NOT_UNIQUE_OR_MISSING')
          src=files[0].read_bytes()
          src_sha=sha256(src).hexdigest()
          print('SOURCE_ZIP_SHA256='+src_sha)
          if src_sha!=EXPECTED_ZIP_SHA256:
              raise RuntimeError('SOURCE_PUBLIC_VERSION_DRIFT')
          m=validate_source_zip(src)
          print('SOURCE_FOUR_FILE_CONTROL_VALID=TRUE')
          champion=build(src)
          champion_sha=sha256(champion).hexdigest()
          print('RECONSTRUCTED_0P18_CHAMPION_SHA256='+champion_sha)
          print('SCORED_CHAMPION_MATCH='+str(champion_sha==expected))
          print('SOURCE_FILES='+','.join(sorted(m)))
          if champion_sha!=expected:
              raise RuntimeError('CHAMPION_ARCHIVE_SHA_MISMATCH')
          print('GEMMA_EXACT_CHAMPION_REPRODUCIBLE=TRUE')
          print('NO_LLM_NO_GOLD_NO_MODEL_NO_SUBMISSION=TRUE')
          PY
      - name: Delete source and champion bytes from ephemeral runner
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/gemma-original-source
          echo "Original source bytes never logged, uploaded, committed or published"
