name: Probe Gemma 4 training model variation

on:
  push:
    branches: [exp/verifier-lora-v0]
    paths:
      - ".github/workflows/probe-gemma4-training-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0"
          python -c "import kaggle, six"

      - name: List Gemma 4 model variations
        shell: bash
        run: |
          set -euo pipefail
          echo "--- google/gemma-4 variations ---"
          kaggle models variations list google/gemma-4 -v --page-size 200
