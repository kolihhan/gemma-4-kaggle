name: Probe Gemma 4 training model variation

on:
  push:
    branches: [exp/verifier-lora-v0]
    paths:
      - ".github/workflows/probe-gemma4-training-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      MODEL_VARIATION: google/gemma-4/Other/gemma-4-e4b-it-qat-q4_0-unquantized

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0"
          python -c "import kaggle, six"

      - name: Verify unquantized E4B variation and files
        shell: bash
        run: |
          set -euo pipefail
          echo "--- variation metadata ---"
          rm -rf /tmp/gemma4-model-meta
          mkdir -p /tmp/gemma4-model-meta
          kaggle models variations get "$MODEL_VARIATION" -p /tmp/gemma4-model-meta
          cat /tmp/gemma4-model-meta/model-instance-metadata.json
          echo "--- latest files ---"
          kaggle models variations files "$MODEL_VARIATION" --format json
          echo "--- versions ---"
          kaggle models variations versions list "$MODEL_VARIATION" --format json --page-size 50
