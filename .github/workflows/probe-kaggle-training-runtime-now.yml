name: Probe Kaggle training runtime packages once

on:
  push:
    branches: [exp/verifier-lora-v0]
    paths:
      - .github/workflows/probe-kaggle-training-runtime-now.yml

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KERNEL_REF: kolihhan/gemma4-training-runtime-probe-${{ github.run_id }}
  KERNEL_DIR: /tmp/kaggle-training-runtime-probe

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0'

      - name: Render CPU-only runtime probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$KERNEL_DIR"
          mkdir -p "$KERNEL_DIR"
          cat > "$KERNEL_DIR/probe.py" <<'PY'
          import importlib
          import importlib.metadata
          import importlib.util
          import json
          import sys

          packages = ["torch", "transformers", "peft", "datasets", "accelerate", "trl", "bitsandbytes"]
          result = {"python": sys.version, "packages": {}}
          for name in packages:
              entry = {"present": importlib.util.find_spec(name) is not None}
              try:
                  entry["version"] = importlib.metadata.version(name)
              except Exception as exc:
                  entry["version_error"] = f"{type(exc).__name__}: {exc}"
              if entry["present"]:
                  try:
                      importlib.import_module(name)
                      entry["import_ok"] = True
                  except Exception as exc:
                      entry["import_ok"] = False
                      entry["import_error"] = f"{type(exc).__name__}: {exc}"
              result["packages"][name] = entry

          try:
              from transformers import AutoModelForCausalLM, AutoProcessor, Trainer, TrainingArguments
              result["transformers_symbols"] = {
                  "AutoModelForCausalLM": True,
                  "AutoProcessor": True,
                  "Trainer": True,
                  "TrainingArguments": True,
              }
          except Exception as exc:
              result["transformers_symbols_error"] = f"{type(exc).__name__}: {exc}"

          try:
              from peft import LoraConfig, get_peft_model
              result["peft_symbols"] = {"LoraConfig": True, "get_peft_model": True}
          except Exception as exc:
              result["peft_symbols_error"] = f"{type(exc).__name__}: {exc}"

          try:
              import torch
              result["torch"] = {
                  "cuda_available": torch.cuda.is_available(),
                  "cuda_device_count": torch.cuda.device_count(),
              }
          except Exception as exc:
              result["torch_error"] = f"{type(exc).__name__}: {exc}"

          print("KAGGLE_TRAINING_RUNTIME_PROBE", json.dumps(result, sort_keys=True))
          PY
          cat > "$KERNEL_DIR/kernel-metadata.json" <<EOF
          {
            "id": "${KERNEL_REF}",
            "title": "gemma4-training-runtime-probe-${GITHUB_RUN_ID}",
            "code_file": "probe.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": false,
            "enable_tpu": false,
            "enable_internet": false,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      - name: Push CPU-only Kaggle probe
        run: kaggle kernels push -p "$KERNEL_DIR" -t 600

      - name: Poll probe
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "[$attempt] $status"
            lower="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
            if grep -Eq 'complete|completed' <<<"$lower"; then
              exit 0
            fi
            if grep -Eq 'error|failed|failure|cancelled|canceled' <<<"$lower"; then
              exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Show probe logs
        if: always()
        run: kaggle kernels logs "$KERNEL_REF" || true
