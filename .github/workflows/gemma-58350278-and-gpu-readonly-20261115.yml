name: "Gemma exact new submission 58350278 and QLoRA smoke status read only"
on:
  push:
    branches: [research/31b-patch-checkpoint-20261114]
    paths: [.github/workflows/gemma-58350278-and-gpu-readonly-20261115.yml]
permissions: {contents: read}
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read authenticated exact submission record and existing private GPU kernel
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import csv,io,json,subprocess
          raw=subprocess.run(["kaggle","competitions","submissions","gemma-4-developer-agent","-v","-q"],
                             text=True,capture_output=True,check=True,timeout=100).stdout.lstrip("\ufeff")
          rows=list(csv.DictReader(io.StringIO(raw)))
          for sid in ("58350278","58183466"):
              matches=[r for r in rows if r.get("ref")==sid]
              assert len(matches)==1, "EXACT_KAGGLE_REF_MISSING_OR_AMBIGUOUS"
              m=matches[0]
              print("GEMMA_EXACT_OFFICIAL_STATUS="+json.dumps({
                 k:m.get(k) for k in ("ref","date","description","status","publicScore","privateScore")
              },sort_keys=True),flush=True)
          check=subprocess.run(["kaggle","kernels","status",
                "kolihhan/gemma31b-qlora-one-step-43605569270"],
                text=True,capture_output=True,timeout=40)
          msg=check.stdout+check.stderr
          state=next((s for s in ("COMPLETE","ERROR","FAILED","CANCELLED","RUNNING","QUEUED","PENDING")
                 if "KernelWorkerStatus."+s in msg),"UNCONFIRMED")
          print("GEMMA_PRIOR_31B_PRIVATE_GPU_STATE="+state,flush=True)
          print("GEMMA_CHECK_READ_ONLY_NO_GPU_NO_SUBMISSION_NO_TRAINING=TRUE",flush=True)
          PY
