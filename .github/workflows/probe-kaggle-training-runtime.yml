name: Probe Kaggle training runtime once

on:
  push:
    branches: [exp/verifier-lora-v0]
    paths:
      - .github/workflows/probe-kaggle-training-runtime.yml

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KERNEL_DIR: /tmp/kaggle-training-runtime-probe
  OUTPUT_DIR: /tmp/kaggle-training-runtime-probe-output
  KERNEL_REF: kolihhan/gemma4-training-runtime-probe-${{ github.run_id }}
  KERNEL_TITLE: gemma4-training-runtime-probe-${{ github.run_id }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render private Kaggle CPU probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$KERNEL_DIR" "$OUTPUT_DIR"
          mkdir -p "$KERNEL_DIR" "$OUTPUT_DIR"
          cat > "$KERNEL_DIR/probe.py" <<'PY'
          import importlib
          import json
          import platform
          import sys

          packages = [
              "torch",
              "transformers",
              "peft",
              "datasets",
              "accelerate",
              "trl",
              "bitsandbytes",
              "safetensors",
              "sentencepiece",
          ]
          result = {
              "python": sys.version,
              "platform": platform.platform(),
              "packages": {},
          }
          for name in packages:
              try:
                  module = importlib.import_module(name)
                  result["packages"][name] = {
                      "available": True,
                      "version": getattr(module, "__version__", None),
                  }
              except Exception as exc:
                  result["packages"][name] = {
                      "available": False,
                      "error": f"{type(exc).__name__}: {exc}",
                  }
          try:
              import torch
              result["torch_cuda_available"] = bool(torch.cuda.is_available())
              result["torch_cuda_version"] = getattr(torch.version, "cuda", None)
          except Exception:
              pass
          print(json.dumps(result, indent=2, sort_keys=True))
          with open("/kaggle/working/runtime-packages.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
          PY
          cat > "$KERNEL_DIR/kernel-metadata.json" <<EOF
          {
            "id": "${KERNEL_REF}",
            "title": "${KERNEL_TITLE}",
            "code_file": "probe.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": false,
            "enable_tpu": false,
            "enable_internet": false,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      - name: Install Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0'

      - name: Push private probe kernel
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p "$KERNEL_DIR" -t 900

      - name: Poll probe to terminal state
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          terminal=""
          for attempt in $(seq 1 45); do
            status_output="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            printf '[%02d] %s\n' "$attempt" "$status_output"
            lower="$(printf '%s' "$status_output" | tr '[:upper:]' '[:lower:]')"
            if grep -Eq 'complete|completed' <<<"$lower"; then terminal="complete"; break; fi
            if grep -Eq 'error|failed|failure|cancelled|canceled' <<<"$lower"; then terminal="error"; break; fi
            sleep 15
          done
          [[ -n "$terminal" ]] || terminal="timeout"
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"

      - name: Collect probe output
        if: always()
        shell: bash
        run: |
          set +e
          kaggle kernels logs "$KERNEL_REF" > "$OUTPUT_DIR/kernel.log" 2>&1
          kaggle kernels output "$KERNEL_REF" -p "$OUTPUT_DIR" -o > "$OUTPUT_DIR/output-download.log" 2>&1
          cat "$OUTPUT_DIR/kernel.log" || true
          find "$OUTPUT_DIR" -maxdepth 3 -type f -printf '%P %s bytes\n' | sort
          test "${{ steps.poll.outputs.terminal }}" = "complete"

      - name: Upload runtime probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-training-runtime-probe-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 7
