name: Candidate history submit-boundary CPU verification

on:
  push:
    branches: [research/dual-agent-recovery-v0-20261108]
    paths:
      - "scripts/candidate_history.py"
      - "tests/test_candidate_history.py"
      - "tests/test_candidate_history_adk.py"
      - ".github/workflows/candidate-history-submit-boundary-cpu.yml"

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official ADK CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0"
          mkdir -p /tmp/candidate-history-adk-wheels
          for wheel in adk_submission-0.2.13-py3-none-any.whl google_adk-1.36.1-py3-none-any.whl adk_eval_core-0.1.0-py3-none-any.whl; do
            kaggle datasets download -d metric/gemma-4-developer-agent-wheelhouse -f "$wheel" -p /tmp/candidate-history-adk-wheels --unzip >/dev/null
          done
          python -m pip install -q --disable-pip-version-check /tmp/candidate-history-adk-wheels/*.whl
      - name: Compile and execute private observer and official ADK fixtures
        run: |
          set -euo pipefail
          python -m py_compile scripts/candidate_history.py tests/test_candidate_history.py tests/test_candidate_history_adk.py
          python -m unittest -v \
            tests.test_candidate_history \
            tests.test_candidate_history_adk \
            tests.test_candidate_history_inventory \
            tests.test_paired_check_skill
          echo "CPU_ONLY=TRUE NO_MODEL_INFERENCE=TRUE NO_TRAINING=TRUE NO_SUBMISSION=TRUE"
