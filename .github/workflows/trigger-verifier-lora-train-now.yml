name: Trigger verified verifier LoRA v0 training once

on:
  push:
    branches: [exp/verifier-lora-v0]
    paths:
      - .github/workflows/trigger-verifier-lora-train-now.yml

permissions:
  contents: read
  actions: read

jobs:
  train-once:
    uses: ./.github/workflows/run-verifier-lora-train.yml
    with:
      confirm: TRAIN
    secrets: inherit
