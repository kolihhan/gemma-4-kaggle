name: Read-only Kaggle 31B submission status probe
# Read-only refresh 2026-11-05 10:04 MYT; no resubmit or training.
# Read-only status refresh: 2026-11-04 22:25 MYT. No new Kaggle submission.
# Read-only status refresh; no new submission or training. 2026-11-04 21:10 MYT
# Status refresh requested 2026-11-04 23:55 MYT; read-only, no re-submission.

on:
  push:
    branches: [exp/capacity-boundary-v0]
    paths:
      - ".github/workflows/probe-untrained-31b-status-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      COMPETITION: gemma-4-developer-agent
      TARGET_REF: "57983156"
      OUT: /tmp/kaggle-31b-readonly-status
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Kaggle CLI
        run: python -m pip install --disable-pip-version-check -q "kaggle==2.2.5" "six==1.17.0"
      - name: Query exact submission ID read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python - <<'PY'
          import csv,datetime,json,os,re,subprocess
          from pathlib import Path
          target=os.environ["TARGET_REF"]
          command=["kaggle","competitions","submissions",os.environ["COMPETITION"],"-v"]
          p=subprocess.run(command,text=True,capture_output=True,timeout=120)
          if p.returncode:
              print("KAGGLE_READ_STATUS_ERROR",p.returncode,p.stderr[:500])
              raise SystemExit(p.returncode)
          rows=list(csv.DictReader(p.stdout.splitlines()))
          matching=[r for r in rows if str(r.get("ref","")).strip()==target]
          if len(matching)!=1:
              print("TARGET_REF_ROWS",len(matching),"TOTAL_ROWS",len(rows))
              raise SystemExit("Expected exactly one Kaggle submission record")
          record=matching[0]
          out={
            "submission_ref":target,
            "checked_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "status":str(record.get("status") or ""),
            "publicScore":str(record.get("publicScore") or ""),
            "privateScore":str(record.get("privateScore") or ""),
            "description":str(record.get("description") or ""),
            "date":str(record.get("date") or ""),
            "only_read_only_queries":True,
            "new_submission_sent":False,
            "new_training_started":False
          }
          Path(os.environ["OUT"],"31b-status.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("KAGGLE_31B_STATUS_JSON",json.dumps(out,sort_keys=True))
          PY
      - name: Upload status JSON
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-untrained-31b-status-${{ github.run_id }}
          path: ${{ env.OUT }}/31b-status.json
          if-no-files-found: error
          retention-days: 14
