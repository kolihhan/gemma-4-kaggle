name: Patch tokenizer mapping compatibility once

on:
  push:
    branches: [exp/verifier-lora-v0]
    paths:
      - .github/workflows/patch-tokenizer-mapping-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/verifier-lora-v0

      - name: Apply minimal Mapping compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("kaggle/train_verifier_lora.py")
          source = path.read_text(encoding="utf-8")
          old_import = "from collections import Counter\n"
          new_import = "from collections import Counter\nfrom collections.abc import Mapping\n"
          if source.count(old_import) != 1:
              raise SystemExit(f"unexpected Counter import count: {source.count(old_import)}")
          source = source.replace(old_import, new_import, 1)

          old_ids = 'input_ids = encoded.get("input_ids") if isinstance(encoded, dict) else None'
          new_ids = 'input_ids = encoded.get("input_ids") if isinstance(encoded, Mapping) else None'
          old_mask = 'attention_mask = encoded.get("attention_mask") if isinstance(encoded, dict) else None'
          new_mask = 'attention_mask = encoded.get("attention_mask") if isinstance(encoded, Mapping) else None'
          if source.count(old_ids) != 1 or source.count(old_mask) != 1:
              raise SystemExit("unexpected tokenizer mapping guard shape")
          source = source.replace(old_ids, new_ids, 1).replace(old_mask, new_mask, 1)
          path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          git diff -- kaggle/train_verifier_lora.py

      - name: Commit exact trainer fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaggle/train_verifier_lora.py
          git commit -m "fix: accept BatchEncoding tokenizer mappings"
          git push origin HEAD:exp/verifier-lora-v0
