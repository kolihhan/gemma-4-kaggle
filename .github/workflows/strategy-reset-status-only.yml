name: Strategy reset - official V2 submission status (read only)
on:
  push:
    branches: [research/strategy-reset-2026-11-06]
    paths:
      - ".github/workflows/strategy-reset-status-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read exact existing submission without submitting or running GPU
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q "kaggle==2.2.5" "six==1.17.0"
          python - <<'PY'
          import datetime, json, subprocess
          ref = "58019162"
          p = subprocess.run(
              ["kaggle", "competitions", "submission", ref],
              capture_output=True, text=True, timeout=90
          )
          allowed = {"submission ref", "status", "public score", "private score", "description"}
          fields = {}
          for ln in p.stdout.splitlines():
              key, sep, val = ln.partition(":")
              if sep and key.strip().lower() in allowed:
                  fields[key.strip().lower().replace(" ", "_")] = val.strip()[:200]
          if p.returncode != 0 or fields.get("submission_ref") != ref:
              print("READ_ONLY_STATUS=UNAVAILABLE; command_exit=",p.returncode)
              raise SystemExit(1)
          print("OFFICIAL_EXISTING_SUBMISSION_STATUS=",json.dumps({
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source": "authenticated kaggle competitions submission",
              "reference":ref,
              "fields":fields,
              "gpu_run":False,
              "new_submission":False,
              "training":False
          },sort_keys=True))
          PY
      - name: Read accelerator quota without reserving GPU
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, subprocess
          p = subprocess.run(
              ["kaggle","quota","--format","json"],
              capture_output=True,text=True,timeout=60
          )
          if p.returncode:
              print("KAGGLE_GPU_QUOTA_QUERY=UNAVAILABLE; exit_code=",p.returncode)
          else:
              import json
              try:
                  data=json.loads(p.stdout)
              except json.JSONDecodeError:
                  print("KAGGLE_GPU_QUOTA_QUERY=NON_JSON")
              else:
                  print("KAGGLE_GPU_QUOTA_QUERY=RETURNED")
                  print("KAGGLE_GPU_QUOTA_REPORT=",json.dumps(data,sort_keys=True)[:3000])
          print("GPU_RESERVATION_OR_NOTEBOOK_LAUNCH=FALSE")
          PY

      - name: Audit submission ledger and inspect exact public V2 static strategy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gemma4-v2-audit
          kaggle competitions submissions gemma-4-developer-agent -v > /tmp/gemma4-v2-audit/submissions.csv
          kaggle kernels output lynnsakurai/gemma-4-budget-fit-agent-w-bounded-rescue/2 -p /tmp/gemma4-v2-audit -o >/dev/null
          python - <<'PY'
          import csv,hashlib,io,json,zipfile
          from pathlib import Path
          root=Path("/tmp/gemma4-v2-audit")
          rows=list(csv.DictReader((root/"submissions.csv").open(encoding="utf-8-sig",newline="")))
          shown=[{k:r.get(k) for k in ("ref","date","status","publicScore","privateScore","description")} for r in rows]
          print("SUBMISSION_LEDGER_COUNT=",len(shown))
          print("SUBMISSION_LEDGER=",json.dumps(shown[:15],sort_keys=True))
          payload=(root/"submission.zip").read_bytes()
          digest=hashlib.sha256(payload).hexdigest()
          expected="a4b10f6b8034fd7fffa144a7ee3fbd8faf9a84503ffb1349d1522ba048b534d3"
          assert digest==expected,(digest,expected)
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              assert sorted(z.namelist())==["agent.yaml","configs/sampling.yaml","eval_config.yaml","prompts/system.md"]
              for name in z.namelist():
                  body=z.read(name).decode("utf8")
                  print("AUDITED_V2_MEMBER=",name,"bytes=",len(body.encode()),"sha256=",hashlib.sha256(body.encode()).hexdigest())
                  print("AUDITED_V2_CONTENT_BEGIN",name)
                  print(body[:16000])
                  print("AUDITED_V2_CONTENT_END",name)
          print("AUDITED_V2_ZIP_SHA256=",digest)
          print("NO_LOCAL_MODEL_OR_BENCHMARK_RUN=TRUE")
          PY
