name: Probe current ADK lifecycle compiler

on:
  push:
    branches: [research/adk-lifecycle-probe]
    paths:
      - ".github/workflows/probe-adk-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --upgrade kaggle
      - name: Download and inspect current scorer wheels
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/adk-wheel /tmp/adk-src /tmp/swe-wheel /tmp/swe-src /tmp/adk-probe
          mkdir -p /tmp/adk-wheel /tmp/adk-src /tmp/swe-wheel /tmp/swe-src /tmp/adk-probe
          kaggle datasets files metric/gemma-4-developer-agent-wheelhouse --page-size 200 > /tmp/wheel-files.txt

          adk_wheel="$(awk 'tolower($0) ~ /adk[_-]submission/ && $0 ~ /\.whl/ {print $1; exit}' /tmp/wheel-files.txt)"
          swe_wheel="$(awk 'tolower($0) ~ /swegemma/ && $0 ~ /\.whl/ {print $1; exit}' /tmp/wheel-files.txt)"
          test -n "$adk_wheel"
          test -n "$swe_wheel"
          printf 'adk=%s\nswegemma=%s\n' "$adk_wheel" "$swe_wheel" > /tmp/adk-probe/wheel-names.txt

          kaggle datasets download -d metric/gemma-4-developer-agent-wheelhouse -f "$adk_wheel" -p /tmp/adk-wheel --unzip
          adk_actual="$(find /tmp/adk-wheel -type f -name '*adk*submission*.whl' | head -n1)"
          test -n "$adk_actual"
          python -m zipfile -e "$adk_actual" /tmp/adk-src
          cp -R /tmp/adk-src/adk_submission /tmp/adk-probe/adk_submission

          kaggle datasets download -d metric/gemma-4-developer-agent-wheelhouse -f "$swe_wheel" -p /tmp/swe-wheel --unzip
          swe_actual="$(find /tmp/swe-wheel -type f -name '*swegemma*.whl' | head -n1)"
          test -n "$swe_actual"
          python -m zipfile -e "$swe_actual" /tmp/swe-src
          cp -R /tmp/swe-src/swegemma /tmp/adk-probe/swegemma

          {
            echo '=== ADK AgentTool / workflows / registries ==='
            grep -R -n -E 'AgentTool|agent_tool|skip_summarization|SequentialAgent|ParallelAgent|LoopAgent|ToolRegistry|CallbackRegistry|config_path|sub_agents' /tmp/adk-src/adk_submission || true
            echo
            echo '=== swegemma tool/callback/compiler/evaluator lifecycle ==='
            grep -R -n -E 'compile_submission|ToolRegistry|CallbackRegistry|submit_patch|submitted|continue your work|EventsCompaction|compaction|evaluate_task|tool_registry|callback_registry' /tmp/swe-src/swegemma || true
          } > /tmp/adk-probe/grep.txt

          python - <<'PY' > /tmp/adk-probe/excerpts.txt
          from pathlib import Path
          specs = [
              (Path('/tmp/adk-src/adk_submission'), ('AgentTool','agent_tool','SequentialAgent','ToolRegistry','CallbackRegistry','config_path','sub_agents')),
              (Path('/tmp/swe-src/swegemma'), ('compile_submission','ToolRegistry','CallbackRegistry','submit_patch','submitted','continue your work','EventsCompaction','compaction','evaluate_task','tool_registry','callback_registry')),
          ]
          for root, needles in specs:
              print(f'##### ROOT {root.name} #####')
              for path in sorted(root.rglob('*.py')):
                  lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
                  hits = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
                  if not hits:
                      continue
                  print(f'--- {path.relative_to(root)} ---')
                  ranges=[]
                  for i in hits:
                      lo=max(0,i-20); hi=min(len(lines),i+32)
                      if ranges and lo <= ranges[-1][1]:
                          ranges[-1]=(ranges[-1][0], max(ranges[-1][1],hi))
                      else:
                          ranges.append((lo,hi))
                  for lo,hi in ranges:
                      for j in range(lo,hi): print(f'{j+1:04d}: {lines[j]}')
                      print()
          PY

          cat /tmp/adk-probe/wheel-names.txt
          sed -n '1,320p' /tmp/adk-probe/grep.txt

      - name: Upload lifecycle probe
        uses: actions/upload-artifact@v4
        with:
          name: adk-lifecycle-probe
          path: /tmp/adk-probe
          if-no-files-found: error
          retention-days: 14
