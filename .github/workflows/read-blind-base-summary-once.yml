name: Read frozen blind BASE summary once

on:
  push:
    branches: [exp/public-train-once]
    paths:
      - ".github/workflows/read-blind-base-summary-once.yml"

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KERNEL_REF: kolihhan/gemma4-frozen-blind-base-41434071381

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Print summary only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/base
          kaggle kernels output "$KERNEL_REF" -p /tmp/base -o >/dev/null
          python -c "import json,pathlib; r=json.loads(pathlib.Path('/tmp/base/verifier_baseline_results.json').read_text()); print(json.dumps({k:v for k,v in r.items() if k!='results'},sort_keys=True))"
