name: Gemma frozen17 real31B outcome cost and patch audit readonly 20261126
on:
  push:
    branches: [research/single-edit-channel-20261124]
    paths: [.github/workflows/gemma-multisurface-outcome-audit-readonly-20261126.yml]
permissions: {contents: read}
concurrency:
  group: gemma-multisurface17-readonly-research-20261126
  cancel-in-progress: false
jobs:
  analyze:
    if: github.event.head_commit.message == 'GO_GEMMA_MULTISURFACE17_READONLY_RESEARCH_20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GPU_KERNEL: kolihhan/gemma4-multisurface-clean17-paired-20261126-v1
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read existing COMPLETE private Kaggle 34-task scorer; aggregate only
        shell: bash
        run: |
          set -euo pipefail
          pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python -m py_compile scripts/diagnose_multisurface_clean17_20261126.py
          status="$(kaggle kernels status "$GPU_KERNEL" 2>&1)"
          [[ "$status" == *KernelWorkerStatus.COMPLETE* ]]
          mkdir -p /tmp/gemma-multisurface-private-research
          kaggle kernels output "$GPU_KERNEL" -p /tmp/gemma-multisurface-private-research -o >/dev/null
          test -f /tmp/gemma-multisurface-private-research/paired_multisurface31b_clean17_results.json
          python -m scripts.diagnose_multisurface_clean17_20261126 --private-result /tmp/gemma-multisurface-private-research/paired_multisurface31b_clean17_results.json
      - name: Read current official receipts for the two pinned builds
        run: |
          python - <<'PY'
          import json
          from scripts.submit_v2_toolcap60_official_once import authenticated_submissions
          rows = authenticated_submissions()
          print("CLEAN17_OFFICIAL_LEDGER=" + json.dumps([
              {k: r.get(k) for k in ("ref", "status", "publicScore")}
              for r in rows if str(r.get("ref")) in {"58183466", "58931890"}
          ]))
          PY
      - name: Compare retained patches and tool traces with the public development reference on CPU
        run: |
          set -euo pipefail
          root=/tmp/gemma-multisurface-private-research
          mkdir -p "$root/reference"
          kaggle competitions download -c gemma-4-developer-agent -f tasks.jsonl -p "$root/reference" -q >/dev/null
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          from scripts.audit_clean17_saved_patches import analyze
          root = Path("/tmp/gemma-multisurface-private-research")
          resources = list((root / "reference").iterdir())
          if len(resources) != 1:
              raise ValueError("expected one official task resource")
          tasks = resources[0]
          if zipfile.is_zipfile(tasks):
              with zipfile.ZipFile(tasks) as archive:
                  names = [n for n in archive.namelist() if Path(n).name == "tasks.jsonl"]
                  if len(names) != 1:
                      raise ValueError("missing unique development task resource")
                  tasks = root / "official-tasks.jsonl"
                  tasks.write_bytes(archive.read(names[0]))
          print("CLEAN17_RETAINED_EVIDENCE=" + json.dumps(analyze(root, tasks), sort_keys=True))
          PY
      - name: Remove private scorer, patches and traces
        if: always()
        run: rm -rf /tmp/gemma-multisurface-private-research
