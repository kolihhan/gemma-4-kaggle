name: "Gemma real 31B QAT one-step synthetic QLoRA private GPU smoke"
on:
  push:
    branches: [research/31b-patch-checkpoint-20261114]
    paths: [.github/workflows/gemma-31b-qlora-one-step-private.yml]
permissions: {contents: read}
concurrency:
  group: gemma-31b-one-step-qlora-smoke-v0
  cancel-in-progress: false
jobs:
  one_step:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: kolihhan/gemma31b-qlora-one-step-${{ github.run_id }}
      KERNEL_DIR: /tmp/gemma31b-qlora-smoke
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: CPU contracts and Kaggle GPU quota gate
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m unittest -q tests.test_gemma31b_qlora_one_step_smoke
          python -m py_compile kaggle/gemma31b_qlora_one_step_smoke.py
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          kaggle quota --format json >/tmp/gemma31b-qlora-quota.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/gemma31b-qlora-quota.json').read_text())
          [h]=[float(x['remaining'].rstrip('h')) for x in a if x['resource']=='GPU']
          print('GEMMA_REAL_QLORA_GPU_QUOTA_H='+str(h),flush=True)
          if h<3.0:
              raise SystemExit('GPU budget below 3-hour hard gate')
          PY
          mkdir -p "$KERNEL_DIR"
          cp kaggle/gemma31b_qlora_one_step_smoke.py "$KERNEL_DIR/gemma31b_smoke.py"
          python - <<'PY'
          import json,os
          from pathlib import Path
          ref=os.environ['KERNEL_REF']
          out=Path(os.environ['KERNEL_DIR'])/'kernel-metadata.json'
          out.write_text(json.dumps({
            "id":ref,"title":ref.split("/",1)[1],
            "code_file":"gemma31b_smoke.py","language":"python",
            "kernel_type":"script","is_private":True,
            "enable_gpu":True,"enable_tpu":False,
            "enable_internet":False,"machine_shape":"NvidiaL4",
            "competition_sources":[],
            "dataset_sources":[],
            "model_sources":["google/gemma-4/transformers/gemma-4-31b-it-qat-q4_0-unquantized/2"],
            "kernel_sources":[]
          },indent=2))
          print('GEMMA_31B_PRIVATE_SYNTHETIC_ONE_STEP_RENDERED=TRUE',flush=True)
          PY
      - name: Push or inspect ONE private 31B synthetic LoRA trainer
        run: |
          set -euo pipefail
          if ! kaggle kernels status "$KERNEL_REF" >/tmp/gemma31b-smoke-status.txt 2>&1; then
            kaggle kernels push -p "$KERNEL_DIR" --accelerator NvidiaL4 -t 3600 >/tmp/gemma31b-smoke-push.txt 2>&1
          fi
          echo "GEMMA_31B_PRIVATE_SYNTHETIC_KERNEL=$KERNEL_REF"
          for i in $(seq 1 180); do
            status="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            case "$status" in
              *KernelWorkerStatus.COMPLETE*) echo 'GEMMA_31B_QLORA_TERMINAL=COMPLETE'; exit 0 ;;
              *KernelWorkerStatus.ERROR*|*KernelWorkerStatus.FAILED*|*KernelWorkerStatus.CANCELLED*)
                echo 'GEMMA_31B_QLORA_TERMINAL=FAILED'; exit 1 ;;
            esac
            if [ "$i" -eq 1 ] || [ $((i % 20)) -eq 0 ]; then echo "GEMMA_31B_QLORA_KERNEL_STATUS=$status"; fi
            sleep 20
          done
          echo 'GEMMA_31B_QLORA_TERMINAL=TIMED_OUT'; exit 1
      - name: Retrieve only structured one-step smoke report, no adapter bytes
        if: always()
        run: |
          set +e
          mkdir -p /tmp/gemma31b-one-step-evidence
          kaggle kernels output "$KERNEL_REF" -p /tmp/gemma31b-one-step-evidence \
            --file-pattern '^gemma31b-lora-smoke-result[.]json$' -o \
            >/tmp/gemma31b-one-step-retrieve.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('/tmp/gemma31b-one-step-evidence/gemma31b-lora-smoke-result.json')
          if not f.is_file():
              print('GEMMA_31B_QLORA_REPORT=NOT_AVAILABLE',flush=True)
          else:
              data=json.loads(f.read_text())
              approved={'status','failure_phase','failure_type','model_class',
                        'visible_cuda_devices','placement','finite_loss',
                        'token_count','trainable_parameter_count',
                        'trainable_tensors_with_gradient','adapter_bytes',
                        'adapter_config_validated','real_task_training_rows',
                        'real_training_example_count','official_submission',
                        'scored_31b_adapter_loading_proven'}
              print('GEMMA_31B_QLORA_VERIFIED='+json.dumps({
                  k:v for k,v in data.items() if k in approved
              },sort_keys=True),flush=True)
          print('NO_REAL_TRAINING_DATA_NO_OFFICIAL_SUBMISSION_NO_ADAPTER_PUBLIC_RELEASE=TRUE')
          PY
