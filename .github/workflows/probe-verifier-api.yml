name: Probe current verifier API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-verifier-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      WHEELHOUSE: metric/gemma-4-developer-agent-wheelhouse

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --upgrade kaggle

      - name: Download current scorer wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scorer-wheelhouse
          kaggle datasets download -d "$WHEELHOUSE" -p /tmp/scorer-wheelhouse --unzip

      - name: Read current verifier and sandbox wiring from swegemma wheel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = sorted(Path('/tmp/scorer-wheelhouse').glob('swegemma-*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'expected one swegemma wheel, got: {wheels}')
          wheel = wheels[0]
          print('WHEEL', wheel.name)
          with zipfile.ZipFile(wheel) as zf:
              names = sorted(zf.namelist())
              for name in names:
                  if name == 'swegemma/evaluate.py' or name.startswith('swegemma/sandbox/'):
                      if not name.endswith('.py'):
                          continue
                      print(f'===== {name} =====')
                      print(zf.read(name).decode('utf-8'))
          PY
