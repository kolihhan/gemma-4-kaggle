name: Official Kaggle cap5 audit - recover existing CPU artifact and submit once
# A Kaggle kernel can be auto-slugified from its title even when metadata id differs.
# Exact existing private kernel created in run 42162206978; no new kernel push.
on:
  push:
    branches: [research/strategy-reset-2026-11-06]
    paths: [".github/workflows/recover-audit-cap5-submission-once.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemma4-official-cap5-score-oneoff
  cancel-in-progress: false

jobs:
  submit-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      COMPETITION: gemma-4-developer-agent
      SOURCE_KERNEL: kolihhan/gemma-4-public-v2-cap5-official-audit
      MARKER: "audit-globalbudget-cap5-v0:public-v2-derived"
      EXPECTED_SHA: "c9eeb05c2b5c3c9a48689a6afd22ed48334efccd685999539c60567c8ef76551"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CLI
        run: python -m pip install -q --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0"
      - name: Confirm exact Kaggle submission slot and prevent retries
        id: ledger
        shell: bash
        run: |
          set -euo pipefail
          kaggle competitions submissions "$COMPETITION" -v > /tmp/cap5-ledger.csv
          python - <<'PY'
          import csv,datetime,os
          rows=list(csv.DictReader(open("/tmp/cap5-ledger.csv",newline="",encoding="utf-8-sig")))
          prior=[r for r in rows if os.environ["MARKER"] in str(r.get("description",""))]
          today=datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          used=[r for r in rows if str(r.get("date","")).startswith(today)]
          pending=[r for r in rows if any(v in str(r.get("status","")).upper() for v in ("PENDING","RUNNING","QUEUED"))]
          print("RECOVERY_EXISTING_EXACT_MARKER=",len(prior))
          print("RECOVERY_TODAY_UTC=",today,"SUBMISSION_COUNT=",len(used))
          if not any(r.get("ref")=="58019162" and r.get("publicScore")=="0.17" for r in rows):
              raise SystemExit("NO_GO: baseline score changed or absent")
          if not prior and (used or pending):
              raise SystemExit("NO_GO: existing daily or pending submission; do not submit twice")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("prior="+("true" if prior else "false")+"\n")
          for r in prior:
              print("RECOVERY_ALREADY_SUBMITTED_REF=",r.get("ref"),r.get("status"))
          PY
      - name: Confirm existing CPU builder terminal COMPLETE
        if: steps.ledger.outputs.prior != 'true'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(kaggle kernels status "$SOURCE_KERNEL")"
          echo "EXISTING_KAGGLE_KERNEL_STATUS=$actual"
          grep -q 'COMPLETE' <<< "$actual" || { echo "NO_GO_EXISTING_KERNEL_NOT_COMPLETE"; exit 1; }
      - name: Retrieve EXISTING private builder ZIP and verify only 8 to 5 minute change
        if: steps.ledger.outputs.prior != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cap5-remote
          kaggle kernels output "$SOURCE_KERNEL" -p /tmp/cap5-remote -o >/dev/null
          python - <<'PY'
          import hashlib,io,os,zipfile
          from pathlib import Path
          from scripts.prepare_public_budgetfit_v2 import EXPECTED_MEMBERS
          file=Path("/tmp/cap5-remote/submission.zip")
          data=file.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          assert sha==os.environ["EXPECTED_SHA"],(sha,os.environ["EXPECTED_SHA"])
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert len(z.namelist())==4 and set(z.namelist())==set(EXPECTED_MEMBERS)
              for name in EXPECTED_MEMBERS:
                  body=z.read(name)
                  if name=="eval_config.yaml":
                      text=body.decode("utf8")
                      assert text.count("max_time_minutes: 5")==1
                      assert "timeout_seconds: 240" in text
                      assert "max_tool_calls: 28" in text
                      assert "max_turns: 80" in text
                      original=text.replace("max_time_minutes: 5","max_time_minutes: 8",1).encode("utf8")
                      assert hashlib.sha256(original).hexdigest()==EXPECTED_MEMBERS[name]
                  else:
                      assert hashlib.sha256(body).hexdigest()==EXPECTED_MEMBERS[name],name
          print("REMOTE_CANDIDATE_SHA256_VERIFIED=",sha)
          print("PREDECLARED_ONE_VARIABLE_DIFF=PASS")
          print("PRIVATE_CPU_OUTPUT_ONLY_NO_GPU_NO_LOCAL_MODEL_EVAL=TRUE")
          PY
      - name: Official Kaggle code submission of exact audited existing ZIP
        if: steps.ledger.outputs.prior != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi(); api.authenticate()
          result=api.competition_submit_code(
              file_name="submission.zip",
              message=os.environ["MARKER"],
              competition=os.environ["COMPETITION"],
              kernel=os.environ["SOURCE_KERNEL"],
              kernel_version=1, quiet=False)
          print("AUDIT_CAP5_OFFICIAL_API_ACCEPTED=",json.dumps(
              result.to_dict() if hasattr(result,"to_dict") else str(result),default=str))
          PY
      - name: Verify official entry and report its status without second submission
        if: steps.ledger.outputs.prior != 'true'
        shell: bash
        run: |
          set -euo pipefail
          kaggle competitions submissions "$COMPETITION" -v > /tmp/cap5-after.csv
          python - <<'PY'
          import csv,json,os
          rows=list(csv.DictReader(open("/tmp/cap5-after.csv",newline="",encoding="utf-8-sig")))
          got=[r for r in rows if os.environ["MARKER"] in str(r.get("description",""))]
          if len(got)!=1: raise SystemExit("OFFICIAL_RECEIPT_NOT_YET_VISIBLE_DO_NOT_RESUBMIT")
          x={k:got[0].get(k) for k in ("ref","date","status","publicScore","privateScore","description")}
          print("AUDIT_CAP5_OFFICIAL_RECEIPT=",json.dumps(x,sort_keys=True))
          print("NO_LOCAL_GPU_NO_TRAINING_NO_MANUAL_BENCHMARK=TRUE")
          PY
