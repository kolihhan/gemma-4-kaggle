name: Monitor frozen blind BASE once

on:
  push:
    branches: [exp/public-train-once]
    paths:
      - ".github/workflows/monitor-blind-base-once.yml"

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KERNEL_REF: kolihhan/gemma4-frozen-blind-base-41434071381

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Status and current logs
        shell: bash
        run: |
          set +e
          kaggle kernels status "$KERNEL_REF"
          echo '--- current kernel logs ---'
          kaggle kernels logs "$KERNEL_REF" | tail -n 500
          exit 0
