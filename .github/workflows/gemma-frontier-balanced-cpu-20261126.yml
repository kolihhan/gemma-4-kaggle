name: Gemma frontier balanced research candidate CPU preflight
on:
  push:
    branches: [research/single-edit-channel-20261124]
    paths: [.github/workflows/gemma-frontier-balanced-cpu-20261126.yml]
permissions: {contents: read}
concurrency:
  group: gemma-frontier-balanced-cpu-20261126
  cancel-in-progress: false
jobs:
  submit:
    if: ${{ github.event.head_commit.message == 'GO_GEMMA_FRONTIER_CPU_20261126' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned validator and notebook builder
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m py_compile scripts/build_frontier_balanced_20261126.py
          pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0 nbformat==5.10.4 pyyaml
          mkdir -p /tmp/gemma-sampling-wheelhouse
          for wheel in adk_submission-0.2.13-py3-none-any.whl google_adk-1.36.1-py3-none-any.whl adk_eval_core-0.1.0-py3-none-any.whl swegemma-0.2.11-py3-none-any.whl; do
            kaggle datasets download -d metric/gemma-4-developer-agent-wheelhouse \
              -f "$wheel" -p /tmp/gemma-sampling-wheelhouse --unzip >/dev/null
          done
          pip install -q --disable-pip-version-check /tmp/gemma-sampling-wheelhouse/*.whl
      - name: Read public data, build and compile exact new candidate without inference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/frontier-source /tmp/frontier-rank2
          kaggle kernels output lynnsakurai/gemma-4-budget-fit-agent-w-bounded-rescue/2 -p /tmp/frontier-source -o >/dev/null
          kaggle datasets download -d muhammedidris28/gemma4-agent-runs -p /tmp/frontier-rank2 --unzip >/dev/null
          python -m scripts.build_frontier_balanced_20261126 --source /tmp/frontier-source/submission.zip --runs /tmp/frontier-rank2/runs.jsonl --out /tmp/frontier-validated
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-balanced-cpu-validated
          path: /tmp/frontier-validated/
          if-no-files-found: error
          retention-days: 7
