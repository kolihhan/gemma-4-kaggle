# Source pinned to Acivar-Digital/gemma4 commit 6c64846dda7ca889b3bb9fbbcde878dbff0f3610
name: Import lightweight Gemma 4 dataset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-lightweight-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download pinned public development files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="6c64846dda7ca889b3bb9fbbcde878dbff0f3610"
          SOURCE_BASE="https://raw.githubusercontent.com/Acivar-Digital/gemma4/${SOURCE_COMMIT}"
          curl --fail --location --retry 3 "${SOURCE_BASE}/tasks.jsonl" --output tasks.jsonl
          curl --fail --location --retry 3 "${SOURCE_BASE}/HARNESS_README.md" --output HARNESS_README.md

      - name: Validate imported files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          tasks_path = Path("tasks.jsonl")
          harness_path = Path("HARNESS_README.md")

          assert tasks_path.is_file() and tasks_path.stat().st_size > 0, "tasks.jsonl is missing or empty"
          assert harness_path.is_file() and harness_path.stat().st_size > 0, "HARNESS_README.md is missing or empty"

          tasks = []
          with tasks_path.open(encoding="utf-8") as handle:
              for line_no, line in enumerate(handle, 1):
                  if not line.strip():
                      continue
                  try:
                      task = json.loads(line)
                  except json.JSONDecodeError as exc:
                      raise AssertionError(f"invalid JSON on line {line_no}: {exc}") from exc
                  tasks.append(task)

          assert len(tasks) == 129, f"expected 129 public development tasks, got {len(tasks)}"
          required = {"instance_id", "repo", "base_commit", "patch", "test_patch"}
          invalid = [
              (idx, sorted(required - set(task)))
              for idx, task in enumerate(tasks, 1)
              if not required.issubset(task)
          ]
          assert not invalid, f"tasks missing required fields: {invalid[:5]}"
          assert len({task["instance_id"] for task in tasks}) == len(tasks), "duplicate instance_id values found"

          print(f"Validated {len(tasks)} tasks")
          print(f"tasks.jsonl bytes: {tasks_path.stat().st_size}")
          print(f"HARNESS_README.md bytes: {harness_path.stat().st_size}")
          PY

      - name: Commit imported files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasks.jsonl HARNESS_README.md
          if git diff --cached --quiet; then
            echo "No dataset changes to commit"
            exit 0
          fi
          git commit -m "Add Gemma 4 public development data"
          git push
