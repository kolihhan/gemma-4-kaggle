name: Solver V4-CGR official Kaggle quota and active-job read only
on:
  push:
    branches: [research/dual-agent-recovery-v0-20261108]
    paths: [".github/workflows/solver-v4-cgr-official-slot-read-once.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read authenticated Kaggle quota and current submission statuses
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0"
          python - <<'PY'
          import csv,io,json,subprocess
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi()
          api.authenticate()
          quota=api.competition_get_submission_limits("gemma-4-developer-agent")
          p=subprocess.run(["kaggle","competitions","submissions","gemma-4-developer-agent","-v"],capture_output=True,text=True,timeout=70)
          if p.returncode:raise RuntimeError("cannot read official submissions")
          rows=list(csv.DictReader(io.StringIO(p.stdout.lstrip("\ufeff"))))
          active=[x.get("ref") for x in rows
                  if (x.get("status") or "").upper().split(".")[-1]
                  in {"PENDING","RUNNING","QUEUED","SCORING","EVALUATING"}]
          print("V4_CGR_OFFICIAL_QUOTA="+json.dumps({
            "allowed_now":quota.num_allowed_now,
            "num_today":quota.num_today,
            "limited_by_total":quota.limited_by_total,
            "active":active,
            "can_submit_one":bool(quota.num_allowed_now>=1 and
                                  not quota.limited_by_total and not active)
          },sort_keys=True),flush=True)
          print("V4_CGR_READ_ONLY_NO_SUBMISSION_NO_GPU=TRUE")
          PY
