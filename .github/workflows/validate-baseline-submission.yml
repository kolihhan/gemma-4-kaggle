name: Validate baseline submission package

on:
  pull_request:
    paths:
      - 'submission/**'
      - '.github/workflows/submit-baseline.yml'
      - '.github/workflows/validate-baseline-submission.yml'
      - 'tests/test_competition_submission_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemma4-baseline-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: kolihhan/gemma4-baseline-preflight-${{ github.run_id }}
      KERNEL_DIR: /tmp/gemma4-baseline-preflight-kernel
      OUTPUT_DIR: /tmp/gemma4-baseline-preflight-output
      MODEL_NAME: gemma-4-e4b-it-qat-w4a16-ct

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package canonical submission.zip deterministically
        shell: bash
        run: |
          set -euo pipefail
          test -f submission/agent.yaml
          rm -f submission.zip submission.sha256
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          root = Path('submission')
          out = Path('submission.zip')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  info = zipfile.ZipInfo(path.relative_to(root).as_posix())
                  info.date_time = (1980, 1, 1, 0, 0, 0)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, path.read_bytes())

          with zipfile.ZipFile(out) as zf:
              names = zf.namelist()
          if 'agent.yaml' not in names:
              raise SystemExit('submission.zip is missing root agent.yaml')
          if any(name.startswith('submission/') for name in names):
              raise SystemExit('submission.zip incorrectly contains a submission/ wrapper directory')
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          print('submission.zip bytes:', out.stat().st_size)
          print('submission.zip sha256:', digest)
          print('submission.zip files:', names)
          Path('submission.sha256').write_text(f'{digest}  submission.zip\n', encoding='utf-8')
          PY

      - name: Install Kaggle CLI
        run: |
          python -m pip install --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0'
          kaggle --version

      - name: Render private CPU current-scorer validation kernel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$KERNEL_DIR" "$OUTPUT_DIR"
          mkdir -p "$KERNEL_DIR" "$OUTPUT_DIR"
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          archive = Path('submission.zip').read_bytes()
          digest = Path('submission.sha256').read_text(encoding='utf-8').split()[0]
          payload = base64.b64encode(archive).decode('ascii')
          kernel_dir = Path(os.environ['KERNEL_DIR'])
          kernel_ref = os.environ['KERNEL_REF']
          model_name = os.environ['MODEL_NAME']

          runtime = f'''from __future__ import annotations

import base64
import hashlib
import importlib
import json
import shutil
import subprocess
import sys
import traceback
import zipfile
from pathlib import Path, PurePosixPath

ARCHIVE_B64 = {payload!r}
EXPECTED_SHA256 = {digest!r}
EXPECTED_MODEL = {model_name!r}
WHEELHOUSE_DIR = Path("/kaggle/input/datasets/metric/gemma-4-developer-agent-wheelhouse")
WORKING_DIR = Path("/kaggle/working")
RESULT_PATH = WORKING_DIR / "baseline_submission_validation.json"


def install_official_wheelhouse() -> None:
    if not WHEELHOUSE_DIR.is_dir():
        raise FileNotFoundError(f"missing official wheelhouse: {{WHEELHOUSE_DIR}}")
    fixed = Path("/tmp/gemma4-baseline-wheelhouse")
    fixed.mkdir(parents=True, exist_ok=True)
    for wheel in WHEELHOUSE_DIR.glob("*.whl"):
        if "cutlass" in wheel.name.lower():
            continue
        name = wheel.name.replace("cu128", "+cu128") if ("cu128" in wheel.name and "+" not in wheel.name) else wheel.name
        target = fixed / name
        if not target.exists():
            try:
                target.symlink_to(wheel)
            except OSError:
                shutil.copyfile(wheel, target)
    wheels = sorted(str(path) for path in fixed.glob("*.whl"))
    if not wheels:
        raise RuntimeError("official scorer wheelhouse contained no usable wheels")
    subprocess.run(
        [sys.executable, "-m", "pip", "install", "-q", "--no-deps", "--force-reinstall", *wheels],
        check=True,
    )
    importlib.invalidate_caches()


def safe_extract(raw: bytes, destination: Path) -> list[str]:
    archive_path = WORKING_DIR / "submission.zip"
    archive_path.write_bytes(raw)
    with zipfile.ZipFile(archive_path) as zf:
        names = zf.namelist()
        for name in names:
            pure = PurePosixPath(name)
            if pure.is_absolute() or ".." in pure.parts:
                raise RuntimeError(f"unsafe archive member: {{name}}")
        if "agent.yaml" not in names:
            raise RuntimeError("archive is missing root agent.yaml")
        if any(name.startswith("submission/") for name in names):
            raise RuntimeError("archive contains unexpected submission/ wrapper directory")
        zf.extractall(destination)
    return names


def main() -> None:
    WORKING_DIR.mkdir(parents=True, exist_ok=True)
    raw = base64.b64decode(ARCHIVE_B64.encode("ascii"))
    actual_sha = hashlib.sha256(raw).hexdigest()
    if actual_sha != EXPECTED_SHA256:
        raise RuntimeError(f"archive SHA mismatch before validation: {{actual_sha}} != {{EXPECTED_SHA256}}")

    install_official_wheelhouse()
    submission_dir = WORKING_DIR / "validated-submission"
    if submission_dir.exists():
        shutil.rmtree(submission_dir)
    submission_dir.mkdir(parents=True)
    names = safe_extract(raw, submission_dir)

    from adk_submission import validate_directory
    from adk_submission.discovery import discover_declared_models
    from swegemma.config import build_submission_limits

    limits, _generation_constraints = build_submission_limits()
    validate_directory(submission_dir, limits=limits)
    models = discover_declared_models(submission_dir)
    if models != {{EXPECTED_MODEL}}:
        raise RuntimeError(f"unexpected declared models: {{sorted(models)}}")

    result = {{
        "status": "valid",
        "archive_sha256": actual_sha,
        "declared_models": sorted(models),
        "file_count": len(names),
        "files": names,
    }}
    RESULT_PATH.write_text(json.dumps(result, indent=2, sort_keys=True), encoding="utf-8")
    print("BASELINE_SUBMISSION_VALIDATION", json.dumps(result, sort_keys=True))


if __name__ == "__main__":
    try:
        main()
    except BaseException as exc:
        RESULT_PATH.write_text(
            json.dumps({{
                "status": "error",
                "archive_sha256": EXPECTED_SHA256,
                "error_type": type(exc).__name__,
                "error": str(exc),
                "traceback": traceback.format_exc(),
            }}, indent=2, sort_keys=True),
            encoding="utf-8",
        )
        raise
'''
          (kernel_dir / 'validate_submission.py').write_text(runtime, encoding='utf-8')
          compile(runtime, 'validate_submission.py', 'exec')

          metadata = {
              'id': kernel_ref,
              'title': f'Gemma4 Baseline Preflight {digest[:12]}',
              'code_file': 'validate_submission.py',
              'language': 'python',
              'kernel_type': 'script',
              'is_private': True,
              'enable_gpu': False,
              'enable_tpu': False,
              'enable_internet': False,
              'docker_image': 'gcr.io/kaggle-private-byod/python@sha256:37c64f7dd9c54116ecd1bcc88817c5469b88387388fade02bfa8bf3fc647d461',
              'dataset_sources': ['metric/gemma-4-developer-agent-wheelhouse'],
              'competition_sources': [],
              'kernel_sources': [],
              'model_sources': [],
          }
          (kernel_dir / 'kernel-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          print('rendered_kernel_ref=', kernel_ref)
          print('rendered_archive_sha256=', digest)
          PY

      - name: Push private Kaggle CPU validation kernel
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p "$KERNEL_DIR" -t 1800

      - name: Poll Kaggle validation kernel to terminal state
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          terminal=""
          for attempt in $(seq 1 120); do
            status_output="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            printf '[%03d] %s\n' "$attempt" "$status_output"
            lower="$(printf '%s' "$status_output" | tr '[:upper:]' '[:lower:]')"
            if grep -Eq 'complete|completed' <<<"$lower"; then
              terminal="complete"
              break
            fi
            if grep -Eq 'error|failed|failure|cancelled|canceled' <<<"$lower"; then
              terminal="error"
              break
            fi
            sleep 15
          done
          if [[ -z "$terminal" ]]; then
            terminal="timeout"
          fi
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          echo "Kaggle terminal state: $terminal"

      - name: Collect current-scorer validation evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$OUTPUT_DIR"
          kaggle kernels logs "$KERNEL_REF" > "$OUTPUT_DIR/kernel.log" 2>&1
          kaggle kernels output "$KERNEL_REF" -p "$OUTPUT_DIR" -o > "$OUTPUT_DIR/output-download.log" 2>&1
          find "$OUTPUT_DIR" -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
          tail -n 160 "$OUTPUT_DIR/kernel.log" || true

      - name: Assert current scorer accepted the exact archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.poll.outputs.terminal }}" != "complete" ]]; then
            echo "Kaggle current-scorer validation did not complete successfully: ${{ steps.poll.outputs.terminal }}" >&2
            exit 1
          fi
          test -f "$OUTPUT_DIR/baseline_submission_validation.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_sha = Path('submission.sha256').read_text(encoding='utf-8').split()[0]
          result = json.loads(
              (Path(os.environ['OUTPUT_DIR']) / 'baseline_submission_validation.json').read_text(encoding='utf-8')
          )
          assert result.get('status') == 'valid', result
          assert result.get('archive_sha256') == expected_sha, result
          assert result.get('declared_models') == ['gemma-4-e4b-it-qat-w4a16-ct'], result
          assert 'agent.yaml' in (result.get('files') or []), result
          print('validated_archive_sha256=', expected_sha)
          print('validated_declared_models=', result['declared_models'])
          print('validated_file_count=', result['file_count'])
          PY

      - name: Upload exact validated submission package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-baseline-e4b-preflight-${{ github.sha }}
          path: |
            submission.zip
            submission.sha256
            /tmp/gemma4-baseline-preflight-output/baseline_submission_validation.json
            /tmp/gemma4-baseline-preflight-output/kernel.log
          if-no-files-found: warn
          retention-days: 30
