name: Validate current scorer wheelhouse

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/current-harness-static.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      WHEELHOUSE: metric/gemma-4-developer-agent-wheelhouse
      MODEL_NAME: gemma-4-e4b-it-qat-w4a16-ct

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle client
        run: python -m pip install --disable-pip-version-check --upgrade kaggle

      - name: Download current official scorer wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scorer-wheelhouse
          kaggle datasets download -d "$WHEELHOUSE" -p /tmp/scorer-wheelhouse --unzip
          echo "wheelhouse files:"
          find /tmp/scorer-wheelhouse -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Prepare scorer wheelhouse filenames
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil
          from pathlib import Path

          src = Path('/tmp/scorer-wheelhouse')
          dst = Path('/tmp/wheelhouse-fixed')
          dst.mkdir(parents=True, exist_ok=True)
          for wheel in src.glob('*.whl'):
              if 'cutlass' in wheel.name.lower():
                  continue
              name = wheel.name.replace('cu128', '+cu128') if ('cu128' in wheel.name and '+' not in wheel.name) else wheel.name
              target = dst / name
              if not target.exists():
                  try:
                      target.symlink_to(wheel)
                  except OSError:
                      shutil.copyfile(wheel, target)
          wheels = sorted(dst.glob('*.whl'))
          print('prepared wheel_count=', len(wheels))
          if not wheels:
              raise SystemExit('no scorer wheels found')
          PY

      - name: Resolve runtime dependencies for vanilla GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          # Kaggle's notebook image already contains the base Python/ML dependency stack,
          # which is why the official starter can install the wheelhouse with --no-deps.
          # A vanilla GitHub runner does not, so resolve the two competition packages and
          # their dependencies first while preferring the official wheelhouse versions.
          python -m pip install --disable-pip-version-check \
            --find-links /tmp/wheelhouse-fixed \
            /tmp/wheelhouse-fixed/adk_submission-*.whl \
            /tmp/wheelhouse-fixed/swegemma-*.whl

      - name: Pin official scorer wheel versions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' wheels < <(find /tmp/wheelhouse-fixed -maxdepth 1 -type f -o -type l | grep -z '\.whl$' || true)
          if [[ ${#wheels[@]} -eq 0 ]]; then
            echo "no scorer wheels found" >&2
            exit 1
          fi
          python -m pip install -q --no-deps --force-reinstall "${wheels[@]}"

      - name: Validate canonical E4B submission with current packages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.metadata
          from pathlib import Path
          from adk_submission import validate_directory
          from adk_submission.discovery import discover_declared_models
          from swegemma.config import build_submission_limits

          submission = Path('submission')
          limits, generation_constraints = build_submission_limits()
          validate_directory(submission, limits=limits)
          models = discover_declared_models(submission)
          print('declared_models=', sorted(models))
          assert models == {'gemma-4-e4b-it-qat-w4a16-ct'}, models

          for pkg in ('swegemma', 'adk-submission', 'adk-eval-core', 'google-adk', 'vllm'):
              try:
                  print(pkg, importlib.metadata.version(pkg))
              except importlib.metadata.PackageNotFoundError:
                  print(pkg, 'NOT_INSTALLED')
          print('STATIC_E4B_SUBMISSION_VALID=1')
          PY

      - name: Inspect current package support surface
        shell: bash
        run: |
          set -euo pipefail
          swegemma --help
          swegemma eval --help
          python - <<'PY'
          import importlib
          from pathlib import Path

          needles = (
              'gemma-4-e4b-it-qat-w4a16-ct',
              'gemma-4-e2b-it-qat-w4a16-ct',
              'gemma-4-12b-it-qat-w4a16-ct',
              'ALLOWED_MODEL_NAMES',
          )
          for package_name in ('swegemma', 'adk_submission'):
              mod = importlib.import_module(package_name)
              root = Path(mod.__file__).resolve().parent
              print('PACKAGE_ROOT', package_name, root)
              for py in sorted(root.rglob('*.py')):
                  text = py.read_text(encoding='utf-8', errors='ignore')
                  hits = [(i, line) for i, line in enumerate(text.splitlines(), 1) if any(n in line for n in needles)]
                  if hits:
                      print('---', py.relative_to(root), '---')
                      for line_no, line in hits:
                          print(f'{line_no}: {line}')
          PY
