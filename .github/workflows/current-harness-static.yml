# Validate the exact canonical baseline archive against the current official scorer wheelhouse.
name: Validate current scorer wheelhouse

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/current-harness-static.yml"
      - "submission/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemma4-static-preflight-v7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      WHEELHOUSE: metric/gemma-4-developer-agent-wheelhouse
      MODEL_NAME: gemma-4-e4b-it-qat-w4a16-ct

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package canonical submission deterministically
        shell: bash
        run: |
          set -euo pipefail
          test -f submission/agent.yaml
          rm -f submission.zip submission.sha256
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          root = Path("submission")
          out = Path("submission.zip")
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  info = zipfile.ZipInfo(path.relative_to(root).as_posix())
                  info.date_time = (1980, 1, 1, 0, 0, 0)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, path.read_bytes())

          with zipfile.ZipFile(out) as zf:
              names = zf.namelist()
          if "agent.yaml" not in names:
              raise SystemExit("submission.zip is missing root agent.yaml")
          if any(name.startswith("submission/") for name in names):
              raise SystemExit("submission.zip contains an unexpected submission/ wrapper")

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          Path("submission.sha256").write_text(f"{digest}  submission.zip\n", encoding="utf-8")
          print("submission.zip bytes:", out.stat().st_size)
          print("submission.zip sha256:", digest)
          print("submission.zip files:", names)
          PY

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0"

      - name: Download current official scorer wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/scorer-wheelhouse /tmp/wheelhouse-fixed
          mkdir -p /tmp/scorer-wheelhouse /tmp/wheelhouse-fixed
          kaggle datasets download -d "$WHEELHOUSE" -p /tmp/scorer-wheelhouse --unzip
          python - <<'PY'
          import shutil
          from pathlib import Path

          src = Path("/tmp/scorer-wheelhouse")
          dst = Path("/tmp/wheelhouse-fixed")
          for wheel in src.glob("*.whl"):
              if "cutlass" in wheel.name.lower():
                  continue
              name = wheel.name.replace("cu128", "+cu128") if ("cu128" in wheel.name and "+" not in wheel.name) else wheel.name
              target = dst / name
              if target.exists():
                  continue
              try:
                  target.symlink_to(wheel)
              except OSError:
                  shutil.copyfile(wheel, target)
          wheels = sorted(dst.glob("*.whl"))
          if not wheels:
              raise SystemExit("no scorer wheels found")
          print("prepared scorer wheels:", len(wheels))
          PY

      - name: Install official scorer wheels without resolving heavy dependencies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' wheels < <(find /tmp/wheelhouse-fixed -maxdepth 1 \( -type f -o -type l \) -name '*.whl' -print0)
          if [[ ${#wheels[@]} -eq 0 ]]; then
            echo "no scorer wheels found" >&2
            exit 1
          fi
          python -m pip install -q --no-deps --force-reinstall "${wheels[@]}"

      - name: Install minimal lightweight validation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "pydantic>=2,<3" \
            "httpx>=0.28.1,<1" \
            "anyio>=4.9,<5" \
            "sniffio>=1,<2" \
            "tenacity>=8.2.3,<9.2" \
            "websockets>=15,<16" \
            "distro>=1.7,<2" \
            "google-auth[requests]>=2.48.1,<3" \
            "fastapi==0.124.1" \
            "starlette>=0.49.1,<1" \
            "authlib>=1.6.6,<2" \
            "click>=8.1.8,<9" \
            "python-dateutil>=2.9.0.post0,<3" \
            "opentelemetry-api>=1.36,<=1.41.1" \
            "opentelemetry-sdk>=1.36,<=1.41.1" \
            "aiosqlite>=0.21" \
            "tzlocal>=5.3,<6" \
            "google-cloud-storage>=2.18,<4"

      - name: Validate exact canonical E4B submission
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import importlib
          import inspect
          from pathlib import Path

          import adk_submission
          from adk_submission import validate_directory
          from adk_submission.discovery import discover_declared_models
          from adk_submission.schema import SandboxedAgentConfig
          from adk_submission.yaml_loader import load_yaml

          submission = Path("submission")

          # Use the current adk-submission package directly.  Avoid importing
          # swegemma's evaluator runtime merely to obtain structural limits.
          limits_cls = None
          validation_module = importlib.import_module(validate_directory.__module__)
          limits_cls = getattr(validation_module, "SubmissionLimits", None)
          if limits_cls is None:
              package_root = Path(adk_submission.__file__).resolve().parent
              for source in package_root.glob("*.py"):
                  if "class SubmissionLimits" not in source.read_text(encoding="utf-8", errors="ignore"):
                      continue
                  module = importlib.import_module(f"adk_submission.{source.stem}")
                  limits_cls = getattr(module, "SubmissionLimits", None)
                  if limits_cls is not None:
                      break
          if limits_cls is None:
              raise RuntimeError("could not locate SubmissionLimits in current adk-submission package")

          known = {
              "max_total_size_bytes": 3 * 1024 * 1024 * 1024,
              "max_file_count": 10_000,
              "max_yaml_files": 1_000,
              "max_yaml_size_bytes": 50 * 1024 * 1024,
              "max_skill_size_bytes": 50 * 1024 * 1024,
              "max_instruction_chars": 1_000_000,
              "max_total_instruction_chars": 10_000_000,
              "max_agents": 500,
              "max_sub_agent_depth": 50,
              "max_skills": 1_000,
              "max_loop_iterations": 500,
              "max_include_depth": 10,
              "allowed_file_extensions": frozenset({
                  ".yaml", ".yml", ".md", ".txt", ".py", ".json", ".safetensors"
              }),
              "adapter_extensions": frozenset({".safetensors"}),
          }
          signature = inspect.signature(limits_cls)
          params = signature.parameters
          kwargs = {name: value for name, value in known.items() if name in params}
          missing = [
              name for name, param in params.items()
              if name not in kwargs
              and param.default is inspect.Parameter.empty
              and param.kind not in (inspect.Parameter.VAR_POSITIONAL, inspect.Parameter.VAR_KEYWORD)
          ]
          if missing:
              raise RuntimeError(f"unhandled required SubmissionLimits fields: {missing}; signature={signature}")
          limits = limits_cls(**kwargs)
          print("submission_limits_class=", f"{limits_cls.__module__}.{limits_cls.__name__}")
          print("submission_limits_signature=", signature)

          layout = validate_directory(submission, limits=limits)
          root_config = load_yaml(layout.config_path, layout.root_dir, limits=limits)
          SandboxedAgentConfig.model_validate(root_config)

          models = discover_declared_models(submission)
          expected = {"gemma-4-e4b-it-qat-w4a16-ct"}
          if models != expected:
              raise SystemExit(f"unexpected declared models: {sorted(models)}")

          archive = Path("submission.zip")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          recorded = Path("submission.sha256").read_text(encoding="utf-8").split()[0]
          if digest != recorded:
              raise SystemExit(f"archive SHA mismatch: {digest} != {recorded}")
          print("STATIC_E4B_SUBMISSION_VALID=1")
          print("validated_archive_sha256=", digest)
          print("validated_declared_models=", sorted(models))
          PY

      - name: Upload exact validated submission package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-baseline-e4b-preflight-${{ github.sha }}
          path: |
            submission.zip
            submission.sha256
          if-no-files-found: warn
          retention-days: 30
