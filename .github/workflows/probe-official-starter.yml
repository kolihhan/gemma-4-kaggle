name: Probe official starter notebook metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-official-starter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --upgrade kaggle
      - name: Pull current official starter metadata and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starter
          kaggle kernels pull ryanholbrook/getting-started-gemma-4-developer-agent -p /tmp/starter -m
          find /tmp/starter -maxdepth 2 -type f -printf '%P\n'
          echo '--- kernel metadata ---'
          cat /tmp/starter/kernel-metadata.json
          echo '--- wheelhouse/model references in notebook ---'
          grep -RniE 'wheelhouse|swegemma|adk-submission|gemma-4-(31b|12b|e4b|e2b)|MODEL_VLLM_EXTRA_ARGS' /tmp/starter || true
      - name: Probe authenticated kernel metadata identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/account-kernel
          kaggle kernels init -p /tmp/account-kernel
          cat /tmp/account-kernel/kernel-metadata.json
