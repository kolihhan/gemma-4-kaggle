name: Gemma authorized five-arm factorial 6 reused valid issues exploratory private GPU
on:
  push:
    branches: [exp/fork-v1-paired-20261127]
    paths: [.github/workflows/gemma-budget-factorial-real31b-20261127.yml]
permissions: {contents: read}
concurrency:
  group: gemma-budget-factorial-real31b-20261127
  cancel-in-progress: false
jobs:
  qualify-and-run:
    if: github.event.head_commit.message == 'GO_BUDGET_FACTORIAL_30_REUSED6_AUTHORIZED_20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GPU_KERNEL: kolihhan/gemma4-budget-factorial30-31b-20261127-v1
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: CPU tests and GPU quota gate before any new execution
        run: |
          set -euo pipefail
          python -m unittest -q tests.test_budget_factorial_20261127 tests.test_build_toolcap60_timeout_recovery
          python -m py_compile scripts/render_budget_factorial_real31b_20261127.py
          pip install -q kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import subprocess,json
          q=[x for x in json.loads(subprocess.run(["kaggle","quota","--format","json"],capture_output=True,text=True,timeout=75,check=True).stdout) if x.get("resource")=="GPU"]
          assert len(q)==1
          free=float(str(q[0]["remaining"]).rstrip("h"))
          print("FACTORIAL_GPU_HOURS_REMAINING="+str(free),flush=True)
          if free<4.0:raise RuntimeError("GPU quota below four-hour gate for 30 trials")
          PY
      - name: Freeze six from previously validated 17 without using outcomes
        run: |
          set -euo pipefail
          root=/tmp/gemma-factorial
          mkdir -p "$root"/{fork,eligible,source}
          ref=kolihhan/gemma4-fork-v1-paired-20261127
          st="$(kaggle kernels status "$ref" 2>&1)"
          [[ "$st" == *KernelWorkerStatus.COMPLETE* ]]
          kaggle kernels output "$ref" -p "$root/fork" -o >/dev/null
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("/tmp/gemma-factorial")
          x=json.loads((root/"fork/paired_fork31b_results.json").read_text())
          ids=sorted(x["selected_public_dev_ids"])
          assert x["status"]=="completed" and len(ids)==len(set(ids))==17 and len(x["results"])==34
          assert hashlib.sha256("|".join(ids).encode()).hexdigest()=="231db5d504930562c4dc78f696a56009635f02bfcf4a79023531d2a3a7eb8bd2"
          # Deterministic selection by ID only, no score/patch/outcome selection.
          selected=sorted(ids,key=lambda t:hashlib.sha256(("budget-factorial-exploratory-six-20261127-v1|"+t).encode()).hexdigest())[:6]
          report={"qualified_count":6,"qualified_ids":selected,"gpu":False,"model_inference":False,"cohort_reused":True,"independent_holdout":False,"qualification_source":"previously verified frozen17"}
          (root/"eligible/budget_factorial_eligibility.json").write_text(json.dumps(report))
          print("FACTORIAL_REUSED_COHORT="+json.dumps({"tasks":6,"prior_valid_pool":17,"independent_holdout":False,"cohort_sha256":hashlib.sha256("|".join(selected).encode()).hexdigest()},sort_keys=True),flush=True)
          PY
      - name: Render 30 evaluations from exact scored Champion and previously validated reused cohort
        run: |
          set -euo pipefail
          root=/tmp/gemma-factorial
          kaggle kernels output lynnsakurai/gemma-4-budget-fit-agent-w-bounded-rescue/2 -p "$root/source" -o >/dev/null
          python -m scripts.render_budget_factorial_real31b_20261127 gpu --source "$root/source/submission.zip" --qualification "$root/eligible/budget_factorial_eligibility.json" --out "$root/gpu"
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path("/tmp/gemma-factorial/gpu")
          x=json.loads((root/"kernel-metadata.json").read_text())
          assert x["is_private"] and x["enable_gpu"] and not x["enable_internet"] and not x["enable_tpu"]
          q=[x for x in json.loads(subprocess.run(["kaggle","quota","--format","json"],capture_output=True,text=True,timeout=75,check=True).stdout) if x.get("resource")=="GPU"]
          assert len(q)==1 and float(str(q[0]["remaining"]).rstrip("h"))>=4.0
          PY
      - name: Launch authorized private 31B GPU once, never official submit
        run: |
          set -euo pipefail
          root=/tmp/gemma-factorial
          if kaggle kernels status "$GPU_KERNEL" >/dev/null 2>&1; then echo STOP_DUPLICATE_GPU;exit 1;fi
          kaggle kernels push -p "$root/gpu" --accelerator NvidiaL4 -t 13800 >"$root/gpu-push.log" 2>&1 || { echo GPU_PUSH_FAILED;exit 1; }
          echo FACTORIAL_30_PRIVATE_GPU_PUSHED
          for i in $(seq 1 240); do
            st="$(kaggle kernels status "$GPU_KERNEL" 2>&1 || true)"
            case "$st" in
              *KernelWorkerStatus.COMPLETE*) mkdir "$root/results";kaggle kernels output "$GPU_KERNEL" -p "$root/results" -o >/dev/null;break ;;
              *KernelWorkerStatus.ERROR*|*KernelWorkerStatus.FAILED*|*KernelWorkerStatus.CANCELLED*) echo GPU_KERNEL_FAILED;exit 1 ;;
            esac
            if (( i % 15 == 0 ));then echo FACTORIAL_GPU_POLL="$i";fi
            sleep 60
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.budget_factorial_20261127 import assess
          root=Path("/tmp/gemma-factorial")
          x=json.loads((root/"results/budget_factorial_real31b.json").read_text())
          q=json.loads((root/"eligible/budget_factorial_eligibility.json").read_text())
          assert x["status"]=="completed" and x["official_submission"] is False and x["training"] is False
          assert x["selected_public_dev_ids"]==q["qualified_ids"]
          report=assess(x["results"],q["qualified_ids"])
          report.update(cohort_reused=True,independent_holdout=False,exploratory_only=True)
          print("FACTORIAL_ACTUAL_SCORE="+json.dumps(report,sort_keys=True),flush=True)
          PY
      - name: Remove private files
        if: always()
        run: rm -rf /tmp/gemma-factorial
