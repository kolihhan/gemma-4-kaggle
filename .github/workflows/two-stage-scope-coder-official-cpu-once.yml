# Critical guard: FIVE ADK user invocations, assert >=1 actual compaction EventActions, no config-only false positive.
# Lifecycle stress: official ADK App compaction_interval=3 for mandatory root SequentialAgent.
# Retry only after correcting V2 implicit agent_class default; no additional GPU or Kaggle competition submit.
name: Mandatory two-stage SWE architecture - official CPU lifecycle gate
on:
  push:
    branches: [research/dual-agent-recovery-v0-20261108]
    paths:
      - .github/workflows/two-stage-scope-coder-official-cpu-once.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify declarative architecture contract and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_two_stage_scope_coder
          python -m py_compile scripts/build_two_stage_scope_coder_candidate.py scripts/probe_two_stage_scope_coder_official.py
          echo "TWO_STAGE_CPU_STATIC_TESTS=PASS"
      - name: Restore official runtime and pinned external 31B control
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check "kaggle==2.2.5" "six==1.17.0"
          mkdir -p /tmp/two-stage-official /tmp/two-stage-wheels
          kaggle kernels output lynnsakurai/gemma-4-budget-fit-agent-w-bounded-rescue/2 -p /tmp/two-stage-official -o >/dev/null
          test -s /tmp/two-stage-official/submission.zip
          for wheel in adk_submission-0.2.13-py3-none-any.whl google_adk-1.36.1-py3-none-any.whl adk_eval_core-0.1.0-py3-none-any.whl swegemma-0.2.11-py3-none-any.whl; do
            kaggle datasets download -d metric/gemma-4-developer-agent-wheelhouse -f "$wheel" -p /tmp/two-stage-wheels --unzip >/dev/null
          done
          python -m pip install -q --disable-pip-version-check /tmp/two-stage-wheels/*.whl
      - name: Build independent fixed-budget candidate (no model calls)
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.build_two_stage_scope_coder_candidate \
            --source-zip /tmp/two-stage-official/submission.zip \
            --out /tmp/two-stage-official/two-stage-candidate.zip
          test -s /tmp/two-stage-official/two-stage-candidate.zip
      - name: Verify actual official ADK lifecycle mandatory order, read-only scope and handoff
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.probe_two_stage_scope_coder_official \
            --zip /tmp/two-stage-official/two-stage-candidate.zip
          echo "TWO_STAGE_OFFICIAL_CPU_GATE=PASS"
      - name: Explicit no GPU, no Kaggle Notebook push, and no official submission
        run: echo "TWO_STAGE_NO_MODEL_NO_GPU_NO_KAGGLE_SUBMISSION=TRUE"
