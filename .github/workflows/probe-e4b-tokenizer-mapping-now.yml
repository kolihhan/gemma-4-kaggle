name: Probe E4B tokenizer mapping once

on:
  push:
    branches: [exp/verifier-lora-v0]
    paths:
      - .github/workflows/probe-e4b-tokenizer-mapping-now.yml

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KERNEL_DIR: /tmp/e4b-tokenizer-probe
  OUTPUT_DIR: /tmp/e4b-tokenizer-probe-output
  KERNEL_REF: kolihhan/gemma4-e4b-tokenizer-probe-${{ github.run_id }}
  MODEL_SOURCE: google/gemma-4/transformers/gemma-4-e4b-it-qat-q4_0-unquantized/2

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render exact trainer tokenizer probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$KERNEL_DIR" "$OUTPUT_DIR"
          mkdir -p "$KERNEL_DIR" "$OUTPUT_DIR"
          python - <<'PY'
          import base64
          from pathlib import Path

          source_b64 = base64.b64encode(Path("kaggle/train_verifier_lora.py").read_bytes()).decode("ascii")
          probe = f'''import base64
import json
import types
from collections.abc import Mapping
from pathlib import Path
from transformers import AutoProcessor

SOURCE_B64 = {source_b64!r}
trainer = types.ModuleType("train_verifier_lora")
trainer.__dict__["__name__"] = "train_verifier_lora"
exec(compile(base64.b64decode(SOURCE_B64), "train_verifier_lora.py", "exec"), trainer.__dict__)

model_path = Path("/kaggle/input/models/google/gemma-4/transformers/gemma-4-e4b-it-qat-q4_0-unquantized/2")
assert model_path.is_dir(), model_path
processor = AutoProcessor.from_pretrained(str(model_path), local_files_only=True)
tokenizer = processor.tokenizer
encoded = tokenizer("hello", add_special_tokens=False, truncation=False)
examples = trainer.tokenize_training_texts(tokenizer, ["hello"])
result = {{
    "encoded_type": type(encoded).__name__,
    "encoded_is_mapping": isinstance(encoded, Mapping),
    "input_ids_type": type(encoded.get("input_ids")).__name__ if isinstance(encoded, Mapping) else None,
    "input_ids_len": len(encoded.get("input_ids")) if isinstance(encoded, Mapping) else None,
    "attention_mask_type": type(encoded.get("attention_mask")).__name__ if isinstance(encoded, Mapping) else None,
    "trainer_example_len": len(examples[0]["input_ids"]),
    "trainer_labels_match": examples[0]["labels"] == examples[0]["input_ids"],
}}
assert result["encoded_is_mapping"] is True, result
assert result["trainer_example_len"] > 0, result
assert result["trainer_labels_match"] is True, result
print("E4B_TOKENIZER_MAPPING_PROBE", json.dumps(result, sort_keys=True))
'''
          Path("/tmp/e4b-tokenizer-probe/probe.py").write_text(probe, encoding="utf-8")
          PY
          cat > "$KERNEL_DIR/kernel-metadata.json" <<EOF
          {
            "id": "${KERNEL_REF}",
            "title": "gemma4-e4b-tokenizer-probe-${GITHUB_RUN_ID}",
            "code_file": "probe.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": false,
            "enable_tpu": false,
            "enable_internet": false,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": ["${MODEL_SOURCE}"]
          }
          EOF

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0'

      - name: Push private CPU tokenizer probe
        run: kaggle kernels push -p "$KERNEL_DIR" -t 900

      - name: Poll tokenizer probe
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          terminal=""
          for attempt in $(seq 1 60); do
            status="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "[$attempt] $status"
            lower="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
            if grep -Eq 'complete|completed' <<<"$lower"; then terminal="complete"; break; fi
            if grep -Eq 'error|failed|failure|cancelled|canceled' <<<"$lower"; then terminal="error"; break; fi
            sleep 10
          done
          [[ -n "$terminal" ]] || terminal="timeout"
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          test "$terminal" = "complete"

      - name: Collect tokenizer probe logs
        if: always()
        shell: bash
        run: |
          set +e
          kaggle kernels logs "$KERNEL_REF" > "$OUTPUT_DIR/kernel.log" 2>&1
          cat "$OUTPUT_DIR/kernel.log" || true

      - name: Upload tokenizer probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e4b-tokenizer-probe-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 7
