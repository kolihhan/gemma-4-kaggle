name: "Gemma second frozen Scale-SWE independent Docker F2P baseline-vs-model"
on:
  push:
    branches: [research/31b-patch-checkpoint-20261114]
    paths: [.github/workflows/gemma-scale-second-real-f2p-cpu.yml]
permissions: {contents: read}
jobs:
  replay_second:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: CPU safety tests and source-only metadata dependencies
        run: |
          set -euo pipefail
          python -m unittest -q tests.test_replay_scale_swe_one_in_docker
          python -m py_compile scripts/replay_scale_swe_one_in_docker.py
          python -m pip install -q --disable-pip-version-check 'pyarrow>=20,<24' 'fsspec>=2025.3,<2027' 'aiohttp>=3.10,<4'
          echo GEMMA_SCALE_SECOND_F2P_SAFETY_GATES=PASS
      - name: Run SECOND prespecified Docker image/test pair exactly as first, no gold
        run: |
          set -euo pipefail
          python -m scripts.replay_scale_swe_one_in_docker --case-index 1
          echo GEMMA_SCALE_SECOND_F2P_NO_REFERENCE_PATCH=TRUE
          echo NO_GPU_NO_TRAINING_NO_OFFICIAL_SUBMISSION=TRUE
