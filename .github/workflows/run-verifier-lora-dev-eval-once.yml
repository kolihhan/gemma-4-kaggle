name: Run verifier LoRA v0 development eval once

on:
  push:
    branches:
      - exp/public-train-once
    paths:
      - .github/workflows/run-verifier-lora-dev-eval-once.yml

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

jobs:
  dev-lora:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Kaggle CLI
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q "kaggle==2.2.5" "six==1.17.0"
          kaggle --version

      - name: Validate renderer
        run: |
          set -euo pipefail
          python -m py_compile scripts/render_verifier_lora_dev_kernel.py

      - name: Render and push verifier-only LoRA development kernel
        env:
          KERNEL_REF: kolihhan/gemma4-verifier-lora-dev-${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf /tmp/verifier-lora-dev-kernel
          python scripts/render_verifier_lora_dev_kernel.py \
            --repo . \
            --kernel-dir /tmp/verifier-lora-dev-kernel \
            --kernel-ref "$KERNEL_REF"
          python -m json.tool /tmp/verifier-lora-dev-kernel/kernel-metadata.json >/dev/null
          kaggle kernels push -p /tmp/verifier-lora-dev-kernel --accelerator NvidiaL4 -t 7200

      - name: Poll verifier-only LoRA development kernel
        id: poll
        env:
          KERNEL_REF: kolihhan/gemma4-verifier-lora-dev-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          terminal=""
          for attempt in $(seq 1 300); do
            out="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            printf '[DEV-LORA %03d] %s\n' "$attempt" "$out"
            lower="$(printf '%s' "$out" | tr '[:upper:]' '[:lower:]')"
            if grep -Eq 'complete|completed' <<<"$lower"; then terminal=complete; break; fi
            if grep -Eq 'error|failed|failure|cancelled|canceled' <<<"$lower"; then terminal=error; break; fi
            sleep 20
          done
          test -n "$terminal" || terminal=timeout
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          test "$terminal" = complete

      - name: Collect and assert development LoRA results
        env:
          KERNEL_REF: kolihhan/gemma4-verifier-lora-dev-${{ github.run_id }}
          OUTPUT_DIR: /tmp/verifier-lora-dev-output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          kaggle kernels logs "$KERNEL_REF" > "$OUTPUT_DIR/kernel.log" 2>&1 || true
          kaggle kernels output "$KERNEL_REF" -p "$OUTPUT_DIR" -o > "$OUTPUT_DIR/output-download.log" 2>&1
          test -s "$OUTPUT_DIR/verifier_baseline_results.json"
          python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['OUTPUT_DIR'])/'verifier_baseline_results.json').read_text()); assert r.get('status')=='completed' and r.get('requested')==9 and len(r.get('results',[]))==9; print('DEV_LORA_SUMMARY',json.dumps({k:v for k,v in r.items() if k!='results'},sort_keys=True))"

      - name: Upload development LoRA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-verifier-lora-v0-dev-${{ github.run_id }}
          path: /tmp/verifier-lora-dev-output
          if-no-files-found: warn
          retention-days: 30
