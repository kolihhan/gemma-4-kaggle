name: Inspect Kaggle submissions once

on:
  push:
    branches: [submit/reliability-v1]
    paths:
      - ".github/workflows/inspect-kaggle-submissions-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      COMPETITION: gemma-4-developer-agent
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Kaggle CLI
        run: python -m pip install --disable-pip-version-check -q "kaggle==2.2.5" "six==1.17.0"
      - name: List current submissions
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CURRENT SUBMISSIONS ==='
          kaggle competitions submissions "$COMPETITION" -v -q | head -n 20
