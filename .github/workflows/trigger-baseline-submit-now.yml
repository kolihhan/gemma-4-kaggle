name: Trigger baseline submit now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-baseline-submit-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact validated baseline submission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run submit-baseline.yml \
            --repo '${{ github.repository }}' \
            --ref main \
            -f validated_sha256='f5e1f19e20df4eb6a780bdf9f6789ed1ec8f7b1aad30e506062d4931b4eb0d7f' \
            -f confirm='SUBMIT' \
            -f message='baseline-e4b-v0'
